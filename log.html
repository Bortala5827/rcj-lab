<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>LOG · RCJ Lab 实验日志</title>
  <meta name="description" content="RCJ Lab 实验日志——持续记录产品的开发、修复与重构动态。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e88e5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='system-ui' font-size='28' font-weight='800' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/hub.v2.css?v=20260814g" />
  <style>
    /* LOG 页专属 */
    .log-hero { padding: 72px 0 32px; text-align: center; }
    .log-hero .eyebrow { color: var(--signal); }
    .log-hero h1 { font-size: clamp(26px, 3.6vw, 34px); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 12px; }
    .log-hero p { font-size: 15px; color: var(--ink-2); max-width: 560px; margin: 0 auto; line-height: 1.7; }

    .log-meta {
      display: flex; justify-content: center; align-items: center; gap: 14px;
      margin-top: 22px; font-size: 12.5px; color: var(--ink-3);
    }
    .log-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 4px rgba(22,163,74,.14); animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .log-meta code { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; color: var(--ink-2); }

    .log-list {
      max-width: 760px; margin: 36px auto 80px; display: flex; flex-direction: column; gap: 12px;
    }
    .log-item {
      background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 22px; display: grid; grid-template-columns: 96px 1fr auto; gap: 18px;
      align-items: start;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .log-item:hover { border-color: var(--ink-4); box-shadow: 0 10px 26px rgba(15,23,42,.06); transform: translateY(-1px); }
    .log-date {
      font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace;
      font-size: 12.5px; color: var(--ink-3); letter-spacing: .02em;
      padding-top: 2px;
    }
    .log-body h3 { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 4px; letter-spacing: -0.01em; }
    .log-body p { font-size: 13.5px; color: var(--ink-2); line-height: 1.65; margin: 0; }
    .log-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .log-tag {
      font-size: 10.5px; font-weight: 600; letter-spacing: .03em;
      padding: 2px 8px; border-radius: 999px;
      background: var(--bg-soft); color: var(--ink-3); border: 1px solid var(--line);
    }
    .log-status {
      font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
      padding: 3px 9px; border-radius: 999px; white-space: nowrap;
      text-transform: uppercase;
    }
    .st-feature { background: #e8f1fc; color: #1565c0; border: 1px solid #c7def6; }
    .st-bugfix  { background: #fff4e0; color: #b45309; border: 1px solid #f7d6b1; }
    .st-refactor { background: #f0e8fc; color: #6d28d9; border: 1px solid #ddd0f5; }

    .log-empty { text-align: center; padding: 60px 0; color: var(--ink-3); font-size: 14px; }
    .log-back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13.5px; font-weight: 600; color: var(--ink-2);
      padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; transition: all .2s ease;
    }
    .log-back:hover { border-color: var(--ink-4); color: var(--ink); transform: translateX(-2px); }

    @media (max-width: 720px) {
      .log-item { grid-template-columns: 1fr; gap: 8px; padding: 16px; }
      .log-date { padding-top: 0; }
      .log-status { justify-self: start; }
    }
  </style>
</head>
<body class="hub">
  <header class="site-header">
    <div class="container nav">
      <a class="wordmark" href="/">
        <span class="mark">R</span>
        <span class="wm-text">RCJ Lab</span>
      </a>
      <nav class="nav-actions" aria-label="站点导航">
        <a class="nav-link" href="https://blog.955827.xyz">Blog</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="log-hero">
      <div class="container">
        <p class="eyebrow">RCJ LAB · EXPERIMENT LOG</p>
        <h1>实验日志</h1>
        <p>只记录两件事：新功能上线，bug 修复。<br />不是营销稿，是真实的工程节奏。</p>
        <div class="log-meta">
          <span class="dot"></span>
          <span>最近更新 <code id="last-update">—</code></span>
          <span class="footer-sep">·</span>
          <span>共 <code id="log-count">—</code> 条实验</span>
        </div>
      </div>
    </section>

    <div class="container">
      <div class="log-list" id="log-list">
        <div class="log-empty">加载中…</div>
      </div>
      <div style="text-align:center; margin-bottom: 80px;">
        <a class="log-back" href="/#lab">← 返回主站</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-row">
        <a class="footer-email" href="mailto:Bortala5827@gmail.com">✉ Bortala5827@gmail.com</a>
        <span class="footer-sep">·</span>
        <span class="footer-copy">© 2026 RCJ9527</span>
        <span class="footer-sep">·</span>
        <span class="footer-powered">Powered by Cloudflare Pages</span>
      </div>
    </div>
  </footer>

<script>
(function(){
  // 极简 JSON 驱动：只读 logs/experiments.json，渲染列表
  var TYPE_MAP = {
    'feature':  { cls: 'st-feature',  label: '新功能' },
    'bugfix':   { cls: 'st-bugfix',   label: 'Bug 修复' },
    'refactor': { cls: 'st-refactor', label: '重构' }
  };

  function render(data){
    var list = document.getElementById('log-list');
    if (!list) return;
    if (!data || !data.experiments || !data.experiments.length) {
      list.innerHTML = '<div class="log-empty">暂无日志。</div>';
      return;
    }
    var html = '';
    data.experiments.forEach(function(e){
      var st = TYPE_MAP[e.type] || TYPE_MAP['feature'];
      var tags = (e.tags || []).map(function(t){
        return '<span class="log-tag">' + escapeHTML(t) + '</span>';
      }).join('');
      html += '<article class="log-item">'
        + '<div class="log-date">' + escapeHTML(e.date) + '</div>'
        + '<div class="log-body">'
          + '<h3>' + escapeHTML(e.title) + '</h3>'
          + '<p>' + escapeHTML(e.summary) + '</p>'
          + (tags ? '<div class="log-tags">' + tags + '</div>' : '')
        + '</div>'
        + '<div class="log-status ' + st.cls + '">' + st.label + '</div>'
      + '</article>';
    });
    list.innerHTML = html;

    var upd = document.getElementById('last-update');
    var cnt = document.getElementById('log-count');
    if (upd) upd.textContent = data.updated || '—';
    if (cnt) cnt.textContent = String(data.experiments.length);
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function fail(msg){
    var list = document.getElementById('log-list');
    if (list) list.innerHTML = '<div class="log-empty">' + escapeHTML(msg) + '</div>';
  }

  fetch('/logs/experiments.json?v=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function(e){ fail('日志加载失败：' + e.message); });

})();
</script>
</body>
</html>
