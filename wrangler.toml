# rcj-lab · Cloudflare Pages + D1 绑定配置
# 2026-10-21：D1 由「REST API + CF_API_TOKEN/CF_ACCOUNT_ID 直查」迁移为原生绑定
# （见 functions/api/admin/data.js 的 DBS 对象，值改为绑定名；track/stats/sing 等用 env.DB）。
# 绑定必须在后台同步配置：Pages → rcj-lab → Settings → Bindings → D1（Git 集成部署以后台为准）。

name = "rcj-lab"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# Sing to Me 语音存储（用户录音）· 用户开通的 R2
[[r2_buckets]]
binding = "SING_R2"
bucket_name = "rcj-sing"

# D1：统一浏览统计 / 订单 / Sing to Me / 手记（track/stats/notes/sing/order 等）
[[d1_databases]]
binding = "DB"
database_name = "rcj-analytics-d1"
database_id = "b3198ef2-6e7c-424e-8a0f-a7b21afc1828"

# D1：FaceTalk 互动数据（mianshi-dazi-d1，后台聚合与留言管理用）
[[d1_databases]]
binding = "FACETALK_DB"
database_name = "mianshi-dazi-d1"
database_id = "f93a89d7-ef5f-49c5-863d-5f1611e1a7f4"
