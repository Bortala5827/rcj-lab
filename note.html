<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3efe5" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Notes · RCJ Lab</title>
  <meta name="description" content="Private notes — jotted down as they come." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5b355'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='system-ui' font-size='34' font-weight='800' fill='%2313101a'%3ER%3C/text%3E%3C/svg%3E" />
  <link rel="preload" href="assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/space-mono-700.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* ============================================================
       RCJ Lab · /note 改版 2026-11-02「Field Notes · 档案卡片」
       与主站「Drafting Desk」同语言：纸面排版 + 工程图纸标注
       字体：Instrument Serif（display）+ Space Mono（标注）+ 系统正文
       ============================================================ */
    @font-face {
      font-family: "Instrument Serif";
      src: url("assets/fonts/instrument-serif-400.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("assets/fonts/space-mono-400.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Mono";
      src: url("assets/fonts/space-mono-700.woff2") format("woff2");
      font-weight: 700; font-style: normal; font-display: swap;
    }
    :root {
      --paper: #f3efe5;
      --paper-2: #ebe5d6;
      --card: #fbf8f1;
      --ink: #171208;
      --ink-2: #514a3b;
      --ink-3: #8d8471;
      --line: rgba(23, 18, 8, .16);
      --line-strong: rgba(23, 18, 8, .8);
      --accent: #c65414;
      --accent-deep: #a03f08;
      --accent-soft: rgba(198, 84, 20, .08);
      --serif: "Instrument Serif", Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", "SimSun", serif;
      --mono: "Space Mono", ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --maxw: 1160px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* 图纸底网格（极淡，纯 CSS，零请求） */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(23, 18, 8, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 18, 8, .05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(120% 100% at 50% 0%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(120% 100% at 50% 0%, #000 40%, transparent 100%);
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    ::selection { background: var(--ink); color: var(--paper); }
    .container { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
    main { position: relative; z-index: 1; }

    /* ---------- 顶部导航（与主站一致） ---------- */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(243, 239, 229, .88);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line-strong);
    }
    .header-inner { display: flex; align-items: baseline; gap: 14px; min-height: 64px; align-items: center; }
    .wordmark { display: flex; align-items: baseline; gap: 14px; }
    .wm-name { font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: -.01em; }
    .wm-sub { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--ink-3); text-transform: uppercase; }
    .header-reg { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--ink-3); }
    .header-reg b { color: var(--accent); font-weight: 700; }
    .nav-link { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); transition: color .15s; }
    .nav-link:hover { color: var(--accent); }

    /* ---------- 手记区 ---------- */
    .note-wrap { max-width: 940px; margin: 0 auto; padding: 56px 0 88px; }

    /* Hero（图纸桌同款：mono-tag + 衬线大标 + 定位十字） */
    .note-hero { position: relative; margin-bottom: 44px; padding-top: 10px; }
    .reg { position: absolute; width: 18px; height: 18px; pointer-events: none; }
    .reg::before, .reg::after { content: ""; position: absolute; background: var(--line-strong); }
    .reg::before { left: 50%; top: 0; width: 1px; height: 100%; }
    .reg::after { top: 50%; left: 0; height: 1px; width: 100%; }
    .reg.tl { top: -14px; left: -34px; } .reg.tr { top: -14px; right: -34px; }
    .note-eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; color: var(--accent-deep);
    }
    .note-eyebrow::before { content: ""; width: 26px; height: 2px; background: var(--accent); }
    .note-hero h1 {
      margin-top: 16px;
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(2.8rem, 6vw, 4.4rem);
      line-height: 1.02; letter-spacing: -.02em;
    }
    .note-hero h1 em { font-style: italic; color: var(--accent); }
    .hero-meta-row {
      display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
      margin-top: 18px;
    }
    .hero-sub { font-size: 15.5px; color: var(--ink-2); max-width: 52ch; }
    .hero-count {
      font-family: var(--mono); font-size: 10.5px; font-weight: 700;
      letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3);
      border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px;
      white-space: nowrap;
    }

    /* ---------- 输入卡：图纸标注式（legend 压线） ---------- */
    .composer {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      padding: 26px 20px 16px;
      margin-bottom: 22px;
      box-shadow: 0 2px 0 rgba(23, 18, 8, .05);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .composer:focus-within { border-color: var(--accent); box-shadow: 0 2px 0 rgba(198, 84, 20, .18); }
    .composer .fig {
      position: absolute; top: -9px; left: 16px; z-index: 2;
      background: var(--paper); padding: 0 10px;
      font-family: var(--mono); font-size: 10.5px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2);
    }
    .composer .fig b { color: var(--accent); }
    .composer textarea {
      width: 100%; min-height: 110px; border: none; outline: none; resize: vertical;
      font: inherit; font-size: 15.5px; line-height: 1.75; color: var(--ink); background: transparent;
    }
    .composer textarea::placeholder { color: var(--ink-3); }
    .composer .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 8px; }
    .c-hint {
      font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
      color: var(--ink-3); font-variant-numeric: tabular-nums;
    }
    .c-hint.warn { color: var(--accent-deep); }

    /* 按钮（主站同款：mono 大写、直角、反色 hover） */
    .btn {
      padding: 11px 26px; border-radius: 2px; cursor: pointer;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
    .btn-ghost {
      padding: 9px 16px; border-radius: 2px; cursor: pointer;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
      transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
    }
    .btn-ghost:hover { background: var(--ink); color: var(--paper); transform: translateY(-2px); }

    /* 工具栏：下划线搜索 + 直角导出 */
    .toolbar { display: flex; gap: 12px; align-items: stretch; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .search {
      flex: 1; min-width: 200px; padding: 9px 2px;
      border: none; border-bottom: 1px solid var(--line-strong); border-radius: 0;
      font-family: var(--mono); font-size: 13px; letter-spacing: .04em; outline: none;
      background: transparent; color: var(--ink);
      transition: border-color .18s ease;
    }
    .toolbar .search:focus { border-bottom-color: var(--accent); }
    .toolbar .search::placeholder { color: var(--ink-3); }

    /* 年份筛选 chips（图纸批注小方块） */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
    .chip {
      padding: 6px 14px; cursor: pointer;
      font-family: var(--mono); font-size: 10.5px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
      border: 1px solid var(--line); border-radius: 2px;
      background: transparent; color: var(--ink-2);
      transition: all .15s ease;
    }
    .chip:hover { border-color: var(--line-strong); color: var(--ink); }
    .chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    /* ---------- 便签墙：归档索引卡（微倾斜 = 钉在桌面上） ---------- */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
      gap: 18px;
      align-items: start; /* 卡片贴合内容高度，不被同行长文拉成等高 */
      padding: 6px 0 20px;
    }
    .note-card {
      position: relative;
      --rot: 0deg;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 14px 16px 18px;
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(23, 18, 8, .05);
      min-height: 96px;
      transform: rotate(var(--rot));
      transition: translate .3s cubic-bezier(.4, 0, .2, 1), box-shadow .3s ease, border-color .3s ease;
      animation: noteUp .55s cubic-bezier(.16, 1, .3, 1) both;
    }
    .note-card:nth-child(3n+1) { --rot: -.35deg; }
    .note-card:nth-child(3n+2) { --rot: .3deg; }
    .note-card:nth-child(3n)   { --rot: -.12deg; }
    .note-card:hover {
      translate: 0 -4px;
      border-color: var(--line-strong);
      box-shadow: 0 12px 26px rgba(23, 18, 8, .12), 0 1px 0 rgba(23, 18, 8, .06);
    }
    .note-head {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--mono); font-size: 10.5px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
      margin-bottom: 10px; padding-right: 26px;
    }
    .note-no { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); }
    .note-no i {
      width: 9px; height: 9px; border-radius: 2px; background: var(--nc, var(--accent));
      transition: box-shadow .25s ease;
    }
    .note-card:hover .note-no i { box-shadow: 0 0 0 3px color-mix(in srgb, var(--nc, var(--accent)) 22%, transparent); }
    .note-time { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-3); }
    .note-text {
      font-size: 14.5px; line-height: 1.72; color: var(--ink-2);
      white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    }
    .note-del {
      position: absolute; top: 8px; right: 8px; z-index: 3;
      border: none; background: none; color: var(--ink-3);
      font-family: var(--mono); font-size: 16px; line-height: 1;
      cursor: pointer; opacity: 0; transition: opacity .15s, color .15s, background .15s;
      padding: 3px 7px; border-radius: 2px;
    }
    .note-edit {
      position: absolute; top: 8px; right: 30px; z-index: 3;
      border: none; background: none; color: var(--ink-3);
      font-size: 14px; line-height: 1;
      cursor: pointer; opacity: 0; transition: opacity .15s, color .15s, background .15s;
      padding: 4px 6px; border-radius: 2px;
    }
    .note-card:hover .note-del, .note-del:focus-visible,
    .note-card:hover .note-edit, .note-edit:focus-visible { opacity: 1; }
    .note-del:hover { color: var(--paper); background: var(--accent); }
    .note-edit:hover { color: var(--paper); background: var(--ink); }
    .note-card.editing .note-del, .note-card.editing .note-edit { display: none; }
    .note-card.editing { border-color: var(--accent); --rot: 0deg; }

    /* 就地编辑器 */
    .edit-ta {
      width: 100%; min-height: 110px; resize: vertical;
      border: 1px solid var(--line); border-radius: 2px;
      background: var(--paper); color: var(--ink);
      font: inherit; font-size: 14.5px; line-height: 1.7;
      padding: 8px 10px; outline: none;
      transition: border-color .15s ease;
    }
    .edit-ta:focus { border-color: var(--accent); }
    .edit-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .edit-foot .btn { padding: 8px 18px; font-size: 11px; }
    .note-edited {
      color: var(--accent-deep); margin-left: 7px;
      letter-spacing: .06em;
    }

    .note-empty, .note-loading {
      padding: 64px 0; text-align: center; grid-column: 1 / -1;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3);
    }

    @keyframes noteUp {
      from { opacity: 0; translate: 0 18px; }
      to { opacity: 1; translate: 0 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .note-card { animation: none; transition: none; }
      .btn:hover, .btn-ghost:hover { transform: none; }
    }

    /* ---------- 页脚（与主站一致，0 链接） ---------- */
    .site-footer { border-top: 2px solid var(--ink); padding: 30px 0 40px; position: relative; z-index: 1; }
    .footer-inner {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
    }
    .footer-brand { font-weight: 700; color: var(--ink); }
    .footer-inner .sep { color: var(--accent); }

    @media (max-width: 640px) {
      .container { padding: 0 20px; }
      .note-wrap { padding: 40px 0 64px; }
      .board { gap: 14px; grid-template-columns: 1fr; }
      .reg.tl, .reg.tr { display: none; }
      .header-reg { display: none; }
      .composer { padding-top: 24px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="wordmark" href="/">
        <span class="wm-name">RCJ Lab</span>
        <span class="wm-sub">Field Notes</span>
      </a>
      <span class="header-reg">SHT. <b>NOTE-01</b> · 2026</span>
      <a class="nav-link" href="https://blog.955827.xyz">Blog ↗</a>
    </div>
  </header>

  <main class="container">
    <div class="note-wrap">
      <div class="note-hero">
        <span class="reg tl" aria-hidden="true"></span>
        <span class="reg tr" aria-hidden="true"></span>
        <p class="note-eyebrow">Archive · Private</p>
        <h1>Notes <em>on file.</em></h1>
        <div class="hero-meta-row">
          <p class="hero-sub">Jot down whatever comes to mind — keep it short. The drawer keeps every card.</p>
          <span class="hero-count" id="count">— ON FILE</span>
        </div>
      </div>

      <div class="composer">
        <span class="fig">Fig. <b>01</b> — New Entry</span>
        <textarea id="input" placeholder="Write something… (Ctrl+Enter to save)"></textarea>
        <div class="c-foot">
          <span class="c-hint" id="hint"></span>
          <button class="btn" onclick="save()">Save</button>
        </div>
      </div>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="SEARCH THE DRAWER…" oninput="onSearch(this.value)" />
        <button class="btn-ghost" onclick="exportNotes('json')">Export JSON</button>
        <button class="btn-ghost" onclick="exportNotes('md')">Export MD</button>
      </div>
      <div class="chips" id="chips"></div>

      <div class="board" id="list"><div class="note-loading">Loading…</div></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span class="footer-brand">© 2026 RCJ Lab</span>
      <span class="sep" aria-hidden="true">✦</span>
      <span>Powered by Cloudflare Pages</span>
      <span class="sep" aria-hidden="true">✦</span>
      <span>Filed by hand, kept on paper.</span>
    </div>
  </footer>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let ALL_NOTES = [];
    let state = { q: '', year: null };

    // 归档卡左上角标色调色板（暖色系，哈希取色保持每条稳定）
    const BAR_COLORS = ['#c65414', '#b3401e', '#8a6a1f', '#3f6f4f', '#1a3591', '#6b4a8f', '#8a3b52'];

    function hashStr(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = (h * 31 + s.charCodeAt(i)) >>> 0;
      }
      return h;
    }

    async function api(method, path, body) {
      try {
        const res = await fetch(path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
          cache: 'no-store',
        });
        let data = null;
        try { data = await res.json(); } catch (_) {}
        return { ok: res.ok, status: res.status, data };
      } catch (e) {
        return { ok: false, status: 0, data: { error: 'Network error' } };
      }
    }

    async function requireLogin() {
      const pw = prompt('Enter password');
      if (pw == null) return false;
      const r = await api('POST', '/api/admin/login', { password: pw });
      if (!r.ok || !r.data || !r.data.ok) { alert('Wrong password'); return false; }
      return true;
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const pad = (n) => (n < 10 ? '0' + n : '' + n);
      const now = new Date();
      const sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
      const md = pad(d.getMonth() + 1) + '.' + pad(d.getDate());
      if (sameDay) return 'Today ' + hm;
      const sameYear = d.getFullYear() === now.getFullYear();
      return (sameYear ? '' : d.getFullYear() + '.') + md + ' ' + hm;
    }

    function noteOf(n, num) {
      const h = hashStr(String(n.id == null ? '' : n.id));
      const nc = BAR_COLORS[h % BAR_COLORS.length];
      const no = 'NO.' + String(num).padStart(3, '0');
      const edited = n.updated_at ? '<span class="note-edited">· EDITED ' + esc(fmtTime(n.updated_at)) + '</span>' : '';
      return '<article class="note-card" style="--nc:' + nc + '" data-id="' + n.id + '">'
        + '<button class="note-edit" title="Edit / Annotate" data-id="' + n.id + '">✎</button>'
        + '<button class="note-del" title="Delete" data-id="' + n.id + '">×</button>'
        + '<div class="note-head">'
        + '<span class="note-no"><i aria-hidden="true"></i>' + no + '</span>'
        + '<span class="note-time">' + esc(fmtTime(n.created_at)) + edited + '</span>'
        + '</div>'
        + '<div class="note-text">' + esc(n.text) + '</div>'
        + '</article>';
    }

    function buildChips() {
      const years = [...new Set(ALL_NOTES.map((n) => new Date(n.created_at).getFullYear()))].sort((a, b) => b - a);
      const wrap = document.getElementById('chips');
      const items = ['All', ...years];
      wrap.innerHTML = items.map((y) => {
        const active = (y === 'All' && state.year == null) || y === state.year;
        return '<span class="chip' + (active ? ' active' : '') + '" data-year="' + (y === 'All' ? '' : y) + '">' + y + '</span>';
      }).join('');
      wrap.querySelectorAll('.chip').forEach((c) => {
        c.addEventListener('click', () => {
          const y = c.dataset.year;
          state.year = y === '' ? null : Number(y);
          buildChips();
          render();
        });
      });
    }

    function render() {
      const el = document.getElementById('list');
      const q = state.q.trim().toLowerCase();
      let notes = ALL_NOTES;
      if (state.year != null) notes = notes.filter((n) => new Date(n.created_at).getFullYear() === state.year);
      if (q) notes = notes.filter((n) => (n.text || '').toLowerCase().includes(q));

      // 稳定编号：全量按旧→新编号（最老 = NO.001），筛选/搜索不改变已有序号
      const numMap = new Map(
        [...ALL_NOTES]
          .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
          .map((n, i) => [n.id, i + 1])
      );

      if (!ALL_NOTES.length) { el.innerHTML = '<div class="note-empty">Empty drawer — write the first entry.</div>'; return; }
      if (!notes.length) { el.innerHTML = '<div class="note-empty">No matching entries.</div>'; return; }

      // 新→旧展示
      const sorted = [...notes].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      el.innerHTML = sorted.map((n) => noteOf(n, numMap.get(n.id) || 0)).join('');
      // 交错入场，不破坏布局
      el.querySelectorAll('.note-card').forEach((card, i) => { card.style.animationDelay = Math.min(i, 24) * 50 + 'ms'; });
      el.querySelectorAll('.note-del').forEach((b) => {
        b.addEventListener('click', () => del(b.dataset.id));
      });
      el.querySelectorAll('.note-edit').forEach((b) => {
        b.addEventListener('click', () => startEdit(b.closest('.note-card'), b.dataset.id));
      });
    }

    function updateCount() {
      const el = document.getElementById('count');
      const n = ALL_NOTES.length;
      el.textContent = n === 0 ? '0 ON FILE' : (n === 1 ? '1 ENTRY ON FILE' : n + ' ENTRIES ON FILE');
    }

    async function load() {
      const el = document.getElementById('list');
      el.innerHTML = '<div class="note-loading">Loading…</div>';
      const r = await api('GET', '/api/notes');
      if (!r.ok || !r.data || !r.data.ok) {
        el.innerHTML = '<div class="note-empty">Failed to load: ' + esc((r.data && r.data.error) || 'Unknown error') + '</div>';
        return;
      }
      ALL_NOTES = r.data.notes || [];
      state.q = ''; state.year = null;
      document.getElementById('search').value = '';
      updateCount();
      buildChips();
      render();
    }

    function onSearch(v) { state.q = v || ''; render(); }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportNotes(fmt) {
      if (!ALL_NOTES.length) { alert('Nothing to export yet'); return; }
      const stamp = new Date().toISOString().slice(0, 10);
      if (fmt === 'json') {
        download('notes-' + stamp + '.json', JSON.stringify(ALL_NOTES, null, 2), 'application/json');
      } else {
        const md = ALL_NOTES.slice().reverse().map((n) => {
          const d = new Date(n.created_at);
          const pad = (x) => (x < 10 ? '0' + x : '' + x);
          const ts = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
          return '## ' + ts + '\n\n' + n.text + '\n';
        }).join('\n---\n\n');
        download('notes-' + stamp + '.md', '# Notes\n\n' + md, 'text/markdown');
      }
    }

    async function save() {
      const ta = document.getElementById('input');
      const text = ta.value.trim();
      if (!text) return;
      let r = await api('POST', '/api/notes', { text });
      if (r.status === 401) {
        if (!(await requireLogin())) return;
        r = await api('POST', '/api/notes', { text });
      }
      if (r.ok && r.data && r.data.ok) { ta.value = ''; updateHint(''); load(); }
      else { updateHint((r.data && r.data.error) || 'Save failed'); }
    }

    async function del(id) {
      if (!confirm('Delete this note?')) return;
      let r = await api('DELETE', '/api/notes?id=' + encodeURIComponent(id));
      if (r.status === 401) {
        if (!(await requireLogin())) return;
        r = await api('DELETE', '/api/notes?id=' + encodeURIComponent(id));
      }
      if (r.ok && r.data && r.data.ok) load();
      else alert((r.data && r.data.error) || 'Delete failed');
    }

    // 就地编辑/批注：卡片变输入框，保存走 PUT（保留原时间，记 EDITED）
    function startEdit(cardEl, id) {
      if (!cardEl || cardEl.classList.contains('editing')) return;
      const note = ALL_NOTES.find((n) => String(n.id) === String(id));
      if (!note) return;
      const textEl = cardEl.querySelector('.note-text');
      if (!textEl) return;
      cardEl.classList.add('editing');
      const wrap = document.createElement('div');
      wrap.className = 'edit-area';
      wrap.innerHTML = '<textarea class="edit-ta" maxlength="6000"></textarea>'
        + '<div class="edit-foot">'
        + '<button class="btn-ghost edit-cancel">Cancel</button>'
        + '<button class="btn edit-save">Save</button>'
        + '</div>';
      const ta = wrap.querySelector('.edit-ta');
      ta.value = textEl.textContent;
      textEl.replaceWith(wrap);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
      wrap.querySelector('.edit-cancel').addEventListener('click', () => render());
      wrap.querySelector('.edit-save').addEventListener('click', () => saveEdit(id, ta));
      ta.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') saveEdit(id, ta);
        if (e.key === 'Escape') render();
      });
    }

    async function saveEdit(id, ta) {
      const text = ta.value.trim();
      if (!text) { ta.focus(); return; }
      let r = await api('PUT', '/api/notes', { id: Number(id), text });
      if (r.status === 401) {
        if (!(await requireLogin())) return;
        r = await api('PUT', '/api/notes', { id: Number(id), text });
      }
      if (r.ok && r.data && r.data.ok) load();
      else alert((r.data && r.data.error) || 'Save failed');
    }

    function updateHint(text) {
      const h = document.getElementById('hint');
      h.textContent = text || '';
      h.classList.toggle('warn', !!text && /上限|过长|Limit|failed/i.test(text));
    }

    document.getElementById('input').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') save();
    });
    document.getElementById('input').addEventListener('input', (e) => {
      const len = e.target.value.trim().length;
      if (len === 0) updateHint('');
      else if (len > 5000) updateHint('Limit reached (5000 chars)');
      else updateHint(len + ' chars');
    });

    load();
  </script>
</body>
</html>
