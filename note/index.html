<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>手记 · RCJ Lab</title>
  <meta name="description" content="私下手记，随手记下一些想法。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e88e5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='system-ui' font-size='28' font-weight='800' fill='white'%3ER%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/hub.v2.css?v=20260822a" />
  <style>
    .note-wrap { max-width: 640px; margin: 0 auto; padding: 32px 0 60px; }
    .note-hero { margin-bottom: 24px; }
    .note-hero h1 { font-size: clamp(24px, 3.2vw, 30px); font-weight: 700; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 8px; }
    .note-hero p { font-size: 14px; color: var(--ink-3); line-height: 1.7; }

    .composer { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(15,23,42,.08); margin-bottom: 20px; }
    .composer textarea { width: 100%; min-height: 76px; border: none; outline: none; resize: vertical; font: inherit; font-size: 15px; line-height: 1.7; color: var(--ink); background: transparent; }
    .composer .c-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .c-hint { font-size: 12px; color: var(--ink-4); }
    .c-hint.warn { color: #dc2626; }
    .btn { padding: 8px 18px; font-size: 14px; font-weight: 600; border: none; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
    .btn:hover { background: #1565c0; }

    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar .search { flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; outline: none; background: #fff; color: var(--ink); }
    .toolbar .search:focus { border-color: var(--accent); }
    .btn-ghost { padding: 8px 14px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink-2); cursor: pointer; }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .chip { padding: 5px 13px; font-size: 13px; border: 1px solid var(--line-2); border-radius: 999px; background: #fff; color: var(--ink-3); cursor: pointer; }
    .chip:hover { color: var(--accent); border-color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .month-head { font-size: 13px; font-weight: 600; color: var(--ink-3); margin: 18px 0 10px; letter-spacing: .02em; }

    .note-list { display: flex; flex-direction: column; gap: 12px; }
    .note-card { position: relative; background: #fff; border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; }
    .note-time { font-size: 12px; color: var(--ink-4); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
    .note-text { font-size: 15px; line-height: 1.75; color: var(--ink); white-space: pre-wrap; word-break: break-word; }
    .note-del { position: absolute; top: 10px; right: 12px; border: none; background: none; color: var(--ink-4); font-size: 16px; cursor: pointer; opacity: 0; transition: opacity .15s; padding: 2px 6px; }
    .note-card:hover .note-del { opacity: 1; }
    .note-del:hover { color: #dc2626; }

    .note-empty { padding: 48px 0; text-align: center; color: var(--ink-3); font-size: 14px; }
    .note-loading { padding: 48px 0; text-align: center; color: var(--ink-3); font-size: 14px; }
  </style>
</head>
<body class="hub">
  <header class="site-header">
    <div class="container nav">
      <a class="wordmark" href="/">
        <span class="mark">R</span>
        <span class="wm-text">RCJ Lab</span>
      </a>
      <nav class="nav-actions" aria-label="站点导航">
        <a class="nav-link" href="https://blog.955827.xyz">Blog</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="note-wrap">
      <div class="note-hero">
        <h1>手记</h1>
        <p>随手记下一些想法，简短即可。</p>
      </div>

      <div class="composer">
        <textarea id="input" placeholder="写点什么…（Ctrl+Enter 保存）"></textarea>
        <div class="c-foot">
          <span class="c-hint" id="hint"></span>
          <button class="btn" onclick="save()">保存</button>
        </div>
      </div>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="搜索手记内容…" oninput="onSearch(this.value)" />
        <button class="btn-ghost" onclick="exportNotes('json')">导出 JSON</button>
        <button class="btn-ghost" onclick="exportNotes('md')">导出 MD</button>
      </div>
      <div class="chips" id="chips"></div>

      <div class="note-list" id="list"><div class="note-loading">读取中…</div></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-row">
        <a class="footer-email" href="mailto:Bortala5827@gmail.com">✉ Bortala5827@gmail.com</a>
        <span class="footer-sep">·</span>
        <span class="footer-copy">© 2026 RCJ9527</span>
        <span class="footer-sep">·</span>
        <span class="footer-powered">Powered by Cloudflare Pages</span>
      </div>
    </div>
  </footer>

  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    let ALL_NOTES = [];
    let state = { q: '', year: null };

    async function api(method, path, body) {
      try {
        const res = await fetch(path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
          cache: 'no-store',
        });
        let data = null;
        try { data = await res.json(); } catch (_) {}
        return { ok: res.ok, status: res.status, data };
      } catch (e) {
        return { ok: false, status: 0, data: { error: '网络错误' } };
      }
    }

    async function requireLogin() {
      const pw = prompt('请输入密码');
      if (pw == null) return false;
      const r = await api('POST', '/api/admin/login', { password: pw });
      if (!r.ok || !r.data || !r.data.ok) { alert('密码错误'); return false; }
      return true;
    }

    function fmtTime(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return '';
      const now = new Date();
      const pad = (n) => (n < 10 ? '0' + n : '' + n);
      const sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      if (sameDay) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      const sameYear = d.getFullYear() === now.getFullYear();
      return (sameYear ? '' : d.getFullYear() + '年') + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function fmtMonthHead(iso) {
      const d = new Date(iso);
      return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月';
    }

    function noteOf(n) {
      return '<div class="note-card">'
        + '<button class="note-del" title="删除" data-id="' + n.id + '">×</button>'
        + '<div class="note-time">' + esc(fmtTime(n.created_at)) + '</div>'
        + '<div class="note-text">' + esc(n.text) + '</div>'
        + '</div>';
    }

    function buildChips() {
      const years = [...new Set(ALL_NOTES.map((n) => new Date(n.created_at).getFullYear()))].sort((a, b) => b - a);
      const wrap = document.getElementById('chips');
      const items = ['全部', ...years];
      wrap.innerHTML = items.map((y) => {
        const active = (y === '全部' && state.year == null) || y === state.year;
        return '<span class="chip' + (active ? ' active' : '') + '" data-year="' + (y === '全部' ? '' : y) + '">' + y + '</span>';
      }).join('');
      wrap.querySelectorAll('.chip').forEach((c) => {
        c.addEventListener('click', () => {
          const y = c.dataset.year;
          state.year = y === '' ? null : Number(y);
          buildChips();
          render();
        });
      });
    }

    function render() {
      const el = document.getElementById('list');
      const q = state.q.trim().toLowerCase();
      let notes = ALL_NOTES;
      if (state.year != null) notes = notes.filter((n) => new Date(n.created_at).getFullYear() === state.year);
      if (q) notes = notes.filter((n) => (n.text || '').toLowerCase().includes(q));

      if (!ALL_NOTES.length) { el.innerHTML = '<div class="note-empty">还没有手记，写第一条吧。</div>'; return; }
      if (!notes.length) { el.innerHTML = '<div class="note-empty">没有匹配的手记。</div>'; return; }

      const groups = [];
      const map = new Map();
      for (const n of notes) {
        const d = new Date(n.created_at);
        const key = d.getFullYear() + '-' + d.getMonth();
        if (!map.has(key)) { const arr = []; map.set(key, arr); groups.push({ label: fmtMonthHead(n.created_at), arr }); }
        map.get(key).push(n);
      }
      el.innerHTML = groups.map((g) => '<div class="month-head">' + esc(g.label) + '</div>' + g.arr.map(noteOf).join('')).join('');
      el.querySelectorAll('.note-del').forEach((b) => {
        b.addEventListener('click', () => del(b.dataset.id));
      });
    }

    async function load() {
      const el = document.getElementById('list');
      el.innerHTML = '<div class="note-loading">读取中…</div>';
      const r = await api('GET', '/api/notes');
      if (!r.ok || !r.data || !r.data.ok) {
        el.innerHTML = '<div class="note-empty">加载失败：' + esc((r.data && r.data.error) || '未知错误') + '</div>';
        return;
      }
      ALL_NOTES = r.data.notes || [];
      state.q = ''; state.year = null;
      document.getElementById('search').value = '';
      buildChips();
      render();
    }

    function onSearch(v) { state.q = v || ''; render(); }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportNotes(fmt) {
      if (!ALL_NOTES.length) { alert('还没有手记可导出'); return; }
      const stamp = new Date().toISOString().slice(0, 10);
      if (fmt === 'json') {
        download('手记-' + stamp + '.json', JSON.stringify(ALL_NOTES, null, 2), 'application/json');
      } else {
        const md = ALL_NOTES.slice().reverse().map((n) => {
          const d = new Date(n.created_at);
          const pad = (x) => (x < 10 ? '0' + x : '' + x);
          const ts = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
          return '## ' + ts + '\n\n' + n.text + '\n';
        }).join('\n---\n\n');
        download('手记-' + stamp + '.md', '# 手记\n\n' + md, 'text/markdown');
      }
    }

    async function save() {
      const ta = document.getElementById('input');
      const text = ta.value.trim();
      if (!text) return;
      let r = await api('POST', '/api/notes', { text });
      if (r.status === 401) {
        if (!(await requireLogin())) return;
        r = await api('POST', '/api/notes', { text });
      }
      if (r.ok && r.data && r.data.ok) { ta.value = ''; updateHint(''); load(); }
      else { updateHint((r.data && r.data.error) || '保存失败'); }
    }

    async function del(id) {
      if (!confirm('删除这条手记？')) return;
      let r = await api('DELETE', '/api/notes?id=' + encodeURIComponent(id));
      if (r.status === 401) {
        if (!(await requireLogin())) return;
        r = await api('DELETE', '/api/notes?id=' + encodeURIComponent(id));
      }
      if (r.ok && r.data && r.data.ok) load();
      else alert((r.data && r.data.error) || '删除失败');
    }

    function updateHint(text) {
      const h = document.getElementById('hint');
      h.textContent = text || '';
      h.classList.toggle('warn', !!text && /上限|过长/.test(text));
    }

    document.getElementById('input').addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') save();
    });
    document.getElementById('input').addEventListener('input', (e) => {
      const len = e.target.value.trim().length;
      if (len === 0) updateHint('');
      else if (len > 5000) updateHint('已达上限 5000 字');
      else updateHint(len + ' 字');
    });

    load();
  </script>
</body>
</html>
