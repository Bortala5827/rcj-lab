<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RCJ Admin · 统一后台</title>
  <style>
    /* ── 移动端客服面板底部安全区适配 ── */
    @media (max-width: 768px) {
      /* 确保底部不被手机浏览器下栏遮挡（iOS Safari 100vh 陷阱） */
      .panel { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
      #content { padding-bottom: env(safe-area-inset-bottom, 0px); }
    }
    /* 高亮滚动到目标会话 */
    tr.conv-active-row td { background: #f0fdfa !important; border-left: 3px solid #0d9488; }
    /* 访问分析重点板块 */
    .traffic-focus { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px; }
    .focus-card { background:linear-gradient(135deg,#f8fafc,#f1f5f9); border:1px solid #e5e7eb; border-radius:12px; padding:16px 18px; position:relative; overflow:hidden; }
    .focus-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--fc,#0d9488); }
    .focus-card .fc-name { font-size:13px; color:#6b7280; margin-bottom:6px; }
    .focus-card .fc-num  { font-size:28px; font-weight:700; color:#111827; line-height:1; }
    .focus-card .fc-sub  { font-size:11px; color:#9ca3af; margin-top:6px; }
    .focus-card.hot { background:linear-gradient(135deg,#fef3c7,#fde68a); border-color:#f59e0b; }
    .focus-card.hot .fc-num { color:#92400e; }
    /* 通勤合并后的 tab */
    .commute-tabs { display:flex; gap:8px; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:10px; }
    .commute-tabs button { padding:6px 14px; border:1px solid var(--line); background:#fff; border-radius:20px; font-size:13px; cursor:pointer; }
    .commute-tabs button.active { background:#0d9488; color:#fff; border-color:#0d9488; }

    :root{
      --bg:#f1f5f9; --surface:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
      --sb:#0f172a; --sb2:#1e293b; --sb-text:#cbd5e1; --sb-muted:#64748b;
      --accent:#1e88e5; --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626;
      --ft:#7b8fc4; --aux:#e07850; --hub:#16a34a; --solo:#6f9b8a;
      --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

    /* ===== 布局 ===== */
    .layout{display:flex;min-height:100vh}
    .sidebar{width:230px;flex-shrink:0;background:var(--sb);color:var(--sb-text);
      display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:30}
    .sb-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
    .sb-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7b8fc4);
      display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
    .sb-brand b{color:#fff;font-size:15px;display:block;line-height:1.2}
    .sb-brand small{color:var(--sb-muted);font-size:11px}
    .sb-nav{padding:12px 10px;flex:1;overflow-y:auto}
    .sb-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:var(--sb-text);
      cursor:pointer;font-size:14px;font-weight:500;margin-bottom:3px;transition:background .15s}
    .sb-item .ico{width:20px;text-align:center;font-size:16px}
    .sb-item:hover{background:var(--sb2)}
    .sb-item.active{background:var(--accent);color:#fff}
    .sb-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--sb-muted)}
    .sb-foot button{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px;padding:0}
    .sb-foot button:hover{color:#f87171}

    .main{margin-left:230px;flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
    .topbar h1{font-size:17px;font-weight:700}
    .topbar .acts{display:flex;gap:10px;align-items:center}
    .topbar .gen{font-size:12px;color:var(--muted)}
    .btn{padding:8px 15px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);
      color:var(--text);border-radius:9px;cursor:pointer;transition:.15s}
    .btn:hover{background:var(--bg)}
    .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
    .btn.primary:hover{background:#1565c0}
    .content{padding:24px;flex:1}
    .mobile-bar{display:none}

    /* ===== 卡片 / 指标 ===== */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
    .stat.ft::before{background:var(--ft)} .stat.aux::before{background:var(--aux)} .stat.hub::before{background:var(--hub)}
    .stat-num{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
    .stat-label{font-size:12px;color:var(--muted);margin-top:3px}
    .stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}

    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
    .panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .panel h3 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
    .dt{width:100%;border-collapse:collapse;font-size:13px}
    .dt th,.dt td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
    .dt th{color:var(--muted);font-weight:600;background:var(--bg)}
    .dt tbody tr:hover{background:var(--bg)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

    /* 趋势图 */
    .chart-wrap{width:100%}
    svg.chart{width:100%;height:auto;display:block}
    .site-stats{display:flex;flex-direction:column;gap:8px;margin-top:4px}
    .ss-item{display:flex;align-items:center;gap:10px;font-size:13px}
    .ss-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
    .ss-name{width:120px;color:#334155}
    .ss-num{font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums}
    .ss-sub{color:#94a3b8;font-size:12px}
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
    .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:#475569}
    .lg-dot{width:10px;height:10px;border-radius:50%}

    /* 条形（城市） */
    .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:13px}
    .bar-label{flex:0 0 86px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{flex:1;background:#f1f5f9;border-radius:999px;height:15px;overflow:hidden}
    .bar-fill{height:100%;background:var(--aux);border-radius:999px;transition:width .5s}
    .bar-val{flex:0 0 34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

    /* 表格 */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line)}
    td{padding:10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
    tr:last-child td{border-bottom:none}
    .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:7px}
    .pill.ok{background:#dcfce7;color:#166534} .pill.warn{background:#fef3c7;color:#92400e}
    .pill.gray{background:#e2e8f0;color:#475569} .pill.blue{background:#dbeafe;color:#1e40af}
    .pill.ft{background:#eef2fb;color:#4a5a8a} .pill.aux{background:#fdeee7;color:#9a4a26}
    .mono{font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)} .small{font-size:12px}
    .empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}

    /* 登录屏 */
    .login-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;z-index:50}
    .login-card{background:#fff;border-radius:18px;padding:34px 32px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .login-card .lc-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#7b8fc4);
      display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;margin-bottom:14px}
    .login-card h2{font-size:19px;margin-bottom:4px}
    .login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
    .login-card input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;outline:none}
    .login-card input:focus{border-color:var(--accent)}
    .login-card button{width:100%;margin-top:14px;padding:12px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer}
    .login-card button:hover{background:#1565c0}
    .login-card .err{background:#fef2f2;color:#991b1b;font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:14px}


    .site-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
    .site-card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.15s}
    .site-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .site-card .sc-ico{font-size:22px;margin-bottom:8px}
    .site-card .sc-name{font-weight:700;font-size:15px;color:var(--text)}
    .site-card .sc-url{font-size:12px;color:var(--accent);word-break:break-all;margin-top:2px}
    .site-card .sc-desc{font-size:12px;color:var(--muted);margin-top:6px}

    .loading{padding:60px;text-align:center;color:var(--muted)}
    .err-box{background:#fef2f2;color:#991b1b;padding:14px 18px;border-radius:11px;font-size:14px;margin-bottom:18px}

    /* 站点状态 */
    .hc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .hc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
    .hc-dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
    .hc-dot.up{background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.13)}
    .hc-dot.down{background:var(--danger);box-shadow:0 0 0 4px rgba(220,38,38,.13);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .hc-body{min-width:0}
    .hc-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
    .hc-url{font-size:11px;color:var(--muted);word-break:break-all;margin-top:1px}
    .hc-status{font-size:12px;margin-top:3px;font-weight:600}
    .hc-status.up{color:#166534} .hc-status.down{color:#991b1b}
    .hc-sum{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:14px;color:var(--muted)}
    .hc-sum b{font-variant-numeric:tabular-nums}
    .hc-sum .okn{color:#166534} .hc-sum .badn{color:#991b1b}

    /* 业务概览卡（站点状态页） */
    .biz-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .biz-hd{font-weight:700;font-size:15px;margin-bottom:10px;color:var(--text)}
    .biz-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
    .biz-row span{color:var(--muted)} .biz-row b{font-variant-numeric:tabular-nums;font-size:15px}
    .biz-ms{font-size:12.5px;margin-top:9px;padding:8px 10px;border-radius:8px;line-height:1.5;background:var(--bg)}
    .biz-ms b{color:var(--text)} .biz-ms.ms-ok{background:rgba(22,163,74,.08)} .biz-ms.ms-ok b{color:#166534}
    .biz-ms.ms-warn{background:rgba(217,119,6,.1)} .biz-ms.ms-warn b{color:#b45309}
    .biz-ms.ms-info{background:rgba(37,99,235,.07)} .biz-ms.ms-info b{color:#1d4ed8}
    .biz-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:middle}

    /* 趋势天数切换 */
    .range-tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
    .range-tabs button{border:none;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;cursor:pointer}
    .range-tabs button.active{background:var(--accent);color:#fff}
    .panel-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .panel-hd h3{margin-bottom:0}

    @media(max-width:820px){
      .sidebar{transform:translateX(-100%);transition:transform .2s;width:220px}
      .sidebar.open{transform:none}
      .main{margin-left:0}
      .mobile-bar{display:flex;align-items:center;gap:12px;background:var(--sb);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:25}
      .mobile-bar .mb-brand{font-weight:700;font-size:15px}
      .mobile-bar .mb-menu{margin-left:auto;font-size:22px;cursor:pointer}
      .grid-2{grid-template-columns:1fr}
      .sidebar{box-shadow:4px 0 24px rgba(0,0,0,.3)}
    }
  </style>
</head>
<body>

<!-- 登录屏 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="lc-logo">RCJ</div>
    <h2>统一后台</h2>
    <p>管理 RCJ 全站数据 · 一次登录</p>
    <div class="err" id="loginErr" style="display:none"></div>
    <input type="password" id="pwInput" placeholder="管理员密码" autofocus />
    <button onclick="doLogin()">登录</button>
  </div>
</div>

<!-- 主框架 -->
<div class="layout" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">RCJ</div>
      <div><b>RCJ Admin</b><small>统一数据后台</small></div>
    </div>
    <nav class="sb-nav" id="nav">
      <div class="sb-item active" data-page="health"><span class="ico">🩺</span>站点状态</div>
      <div class="sb-item" data-page="traffic"><span class="ico">📊</span>访问分析</div>
      <div class="sb-item" data-page="support"><span class="ico">💬</span>客服系统</div>
      <div class="sb-item" data-page="aux"><span class="ico">🛡️</span>辅警题库</div>
      <div class="sb-item" data-page="facetalk"><span class="ico">💬</span>FaceTalk</div>
      <div class="sb-item" data-page="orders"><span class="ico">💰</span>订单提醒</div>
    </nav>
    <div class="sb-foot">
      <div id="genTime">—</div>
      <button onclick="doLogout()">退出登录</button>
    </div>
  </aside>

  <div class="main">
    <div class="mobile-bar">
      <span class="mb-brand">RCJ Admin</span>
      <span class="mb-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</span>
    </div>
    <div class="topbar">
      <h1 id="pageTitle">站点状态</h1>
      <div class="acts">
        <span class="gen" id="genSmall"></span>
        <button class="btn" onclick="loadData()">↻ 刷新</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading">读取中…</div>
    </div>
  </div>
</div>

<script>
const API = '/api/admin';
const SITE_COLORS = { aux:'#1e88e5', xf:'#ef6c00', facetalk:'#8e24aa', hub:'#2e7d32', solospeak:'#00897b', letout:'#6d4c41', training:'#c0ca33', exam:'#d81b60', shop:'#f59e0b' };
const SITE_LABELS = { aux:'辅警刷题站', xf:'消防刷题站', facetalk:'FaceTalk', hub:'RCJ Lab', solospeak:'SoloSpeak', letout:'LetOut', training:'RCJ Training', exam:'Exam Hub', shop:'Shop 商店' };
let DATA = null;
// 登录态由 HttpOnly cookie（rcj_admin）接管，1 天过期；不存任何密码于 localStorage

// ---------- 统一请求封装（含 8s 超时 + 错误归一）----------
async function apiReq(path, opts = {}) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), opts.timeout || 8000);
  try {
    const res = await fetch(API + path, Object.assign({ cache: 'no-store' }, opts, { signal: ac.signal }));
    let data = null;
    try { data = await res.json(); } catch (_) {}
    return { ok: res.ok, status: res.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: null, error: (e && e.name === 'AbortError') ? '请求超时' : (e && e.message) || '网络错误' };
  } finally { clearTimeout(timer); }
}
const apiGet = (p, o) => apiReq(p, o);
const apiPost = (p, body, o) => apiReq(p, Object.assign({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, o));

function showLogin() {
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ---------- 登录 ----------
async function doLogin(){
  const v = document.getElementById('pwInput').value.trim();
  if(!v) return;
  const e = document.getElementById('loginErr'); e.style.display = 'none';
  const r = await apiPost('/login', { password: v });
  if(r.ok && r.data && r.data.ok){ enterApp(); loadData(); }
  else { e.style.display = 'block'; e.textContent = (r.data && r.data.error) || r.error || '登录失败'; }
}
function doLogout(){
  fetch(API+'/logout',{method:'POST'}).finally(()=>location.reload());
}
function enterApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='flex';
}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ---------- 数据加载 ----------
async function loadData(force){
  const c=document.getElementById('content');
  c.innerHTML='<div class="loading">读取中…</div>';
  const r=await apiGet('/data'+(force?'?nocache=1':''));
  if(r.status===401){ showLogin(); return; }
  if(!r.ok || !r.data || !r.data.ok){
    const msg=(r.data && r.data.error) || r.error || ('HTTP ' + r.status) || '加载失败';
    c.innerHTML='<div class="err-box">'+esc(msg)+'<div style="margin-top:12px"><button class="btn" onclick="loadData()">↻ 重试</button></div></div>';
    return;
  }
  DATA=r.data;
  document.getElementById('genTime').textContent='更新于 '+fmtTime(DATA.generatedAt);
  document.getElementById('genSmall').textContent=fmtTime(DATA.generatedAt);
  renderPage(currentPage);
}

// ---------- 导航 ----------
let currentPage='health';
document.getElementById('nav').addEventListener('click',e=>{
  const it=e.target.closest('.sb-item'); if(!it)return;
  document.querySelectorAll('.sb-item').forEach(x=>x.classList.toggle('active',x===it));
  currentPage=it.dataset.page;
  document.getElementById('pageTitle').textContent=it.textContent.trim();
  document.getElementById('sidebar').classList.remove('open');
  renderPage(currentPage);
});

// 程序化切换页面（供卡片内按钮跳转用，如留言墙「查看全部」、Sing to Me 审核）
window.switchPage = function(p){
  currentPage=p;
  document.querySelectorAll('.sb-item').forEach(x=>x.classList.toggle('active', x.dataset.page===p));
  renderPage(p);
};

function renderPage(p){
  if(!DATA){ document.getElementById('content').innerHTML='<div class="loading">读取中…</div>'; return; }  if(p==='overview') renderOverview();
  else if(p==='health') renderHealth();
  else if(p==='facetalk') renderFaceTalk();
  else if(p==='aux') renderAux();
  else if(p==='sites') renderSites();
  else if(p==='commute') { if(commuteTab==='chat') renderCommuteChat(); else renderCommute(); }
  else if(p==='wall') renderWallMgmt();
  else if(p==='ai') renderAI();
  else if(p==='support') renderSupport();
  else if(p==='traffic') renderTraffic();
  else if(p==='sing') renderSingRequests();
  else if(p==='orders') renderOrders();
}

// 邮件/直达链接：站外跳转进客服管理并定位到具体会话
// ?conversation=xxx 或 ?page=support&conversation=xxx
function handleDeepLink(){
  const url = new URL(location.href);
  const conv = url.searchParams.get('conversation');
  const wantSupport = conv || url.searchParams.get('page') === 'support';
  if (wantSupport) {
    currentPage = 'support';
    document.querySelectorAll('.sb-item').forEach(x => x.classList.toggle('active', x.dataset.page === 'support'));
    document.getElementById('pageTitle').textContent = '客服管理';
    renderSupport();
    if (conv) {
      window._pendingConvId = conv;
    }
  }
}

// ---------- AI 监控 ----------
function renderAI(){
  const d = DATA.ai || { total:0, ok:0, fail:0, successRate:0, byProject:{}, byProvider:{}, byDay:{} };
  const content = document.getElementById('content');
  document.getElementById('pageTitle').textContent = 'AI 监控';
  let html = '';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-num">'+d.total+'</div><div class="stat-label">总调用量</div></div>';
  html += '<div class="stat"><div class="stat-num" style="color:var(--ok)">'+d.ok+'</div><div class="stat-label">成功</div></div>';
  html += '<div class="stat"><div class="stat-num" style="color:var(--danger)">'+d.fail+'</div><div class="stat-label">失败</div></div>';
  html += '<div class="stat"><div class="stat-num">'+d.successRate+'%</div><div class="stat-label">成功率</div></div>';
  html += '</div>';
  function renderTable(title, tag, data){
    let h = '<div class="panel"><h3>'+title+' <span class="tag">'+tag+'</span></h3>';
    const keys = Object.keys(data || {});
    if(!keys.length){ h += '<p class="small muted">暂无数据（部署后首次 AI 调用会自动建表并开始记录）</p>'; }
    else {
      h += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
      h += '<tr style="text-align:left;border-bottom:1px solid var(--line)"><th style="padding:8px">名称</th><th style="padding:8px">总量</th><th style="padding:8px">成功</th><th style="padding:8px">失败</th><th style="padding:8px">成功率</th></tr>';
      keys.sort(function(a,b){return (data[b].total||0)-(data[a].total||0);}).forEach(function(k){
        var s = data[k]; var rate = s.total ? Math.round(s.ok/s.total*100) : 0;
        h += '<tr style="border-bottom:1px solid var(--line)"><td style="padding:8px;font-weight:600">'+esc(k||'unknown')+'</td><td style="padding:8px">'+s.total+'</td><td style="padding:8px;color:var(--ok)">'+s.ok+'</td><td style="padding:8px;color:var(--danger)">'+s.fail+'</td><td style="padding:8px">'+rate+'%</td></tr>';
      });
      h += '</table>';
    }
    h += '</div>';
    return h;
  }
  html += renderTable('各项目调用', '按 project 聚合', d.byProject);
  html += renderTable('各渠道调用', '按 provider 聚合', d.byProvider);
  // 最近 14 天趋势
  html += '<div class="panel"><h3>最近 14 天趋势 <span class="tag">按日聚合</span></h3>';
  var days = Object.keys(d.byDay || {}).sort();
  if(!days.length){ html += '<p class="small muted">暂无数据</p>'; }
  else {
    var max = 1; days.forEach(function(day){ if((d.byDay[day].total||0)>max) max=d.byDay[day].total; });
    html += '<div style="display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px">';
    days.forEach(function(day){
      var s = d.byDay[day]; var h = Math.round((s.total||0)/max*100);
      var rate = s.total ? Math.round(s.ok/s.total*100) : 0;
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="'+day+': '+s.total+'次 '+rate+'%">';
      html += '<div style="width:100%;background:var(--accent);border-radius:3px 3px 0 0;height:'+h+'%;min-height:'+(s.total?2:0)+'px"></div>';
      html += '<span style="font-size:9px;color:var(--muted);transform:rotate(-45deg);white-space:nowrap">'+day.slice(5)+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  content.innerHTML = html;
}

    +'<button onclick="setTrendDays(14)" class="'+(trendDays===14?'active':'')+'">14天</button>'
    +'<button onclick="setTrendDays(30)" class="'+(trendDays===30?'active':'')+'">30天</button>'
    +'</span></div>'+multiLineChart(fullSeries, trendDays)+'</div>';

  // 今日 TOP + 最近访问明细

  if(top.length){
    const maxN=Math.max(1,top[0].n);
    top.forEach(t=>{
      const pct=Math.round(t.n/maxN*100);
      topHtml+='<div class="bar-row"><span class="bar-label">'+SITE_LABELS[t.site]+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+(SITE_COLORS[t.site]||'#64748b')+'"></div></div><span class="bar-val">'+t.n+'</span></div>';
    });

function setTrendDays(n){
  trendDays=n;
  renderOverview();
}

function calcTodayTop(seriesMap){
  return Object.values(seriesMap)
    .map(s=>{
      const pts=s.points||[];
      const last=pts.length?pts[pts.length-1]:null;
      return { site:s.site, day:last?last.day:'—', n:last?Number(last.s)||0:0 };
    })
    .sort((a,b)=>b.n-a.n);
}

async function renderHealth(){

  c.innerHTML='<div class="loading">正在探测各站点…</div>';
  const r=await apiGet('/health');
  if(r.status===401){ showLogin(); return; }
  if(!r.ok || !r.data || !r.data.ok){
    const msg=(r.data && r.data.error) || r.error || ('HTTP '+r.status);
    c.innerHTML='<div class="err-box">'+esc(msg)+'<div style="margin-top:12px"><button class="btn" onclick="renderHealth()">↻ 重试</button></div></div>';
    return;
  }
  const h=r.data, sites=h.sites||[];
  const upN=h.summary&&h.summary.up!==undefined?h.summary.up:sites.filter(s=>s.ok).length;
  const total=sites.length;
  let html='<div class="panel"><h3>🩺 站点在线状态</h3>'
    +'<div class="hc-sum">'+upN+' / '+total+' 个站点正常'

  sites.forEach(s=>{

    html+='<div class="hc-card"><span class="hc-dot '+(up?'up':'down')+'"></span><div class="hc-body">'
      +'<div class="hc-name">'+esc(s.name)+'</div>'
      +'<div class="hc-url">'+esc(s.url.replace(/^https?:\/\//,''))+'</div>'
      +'<div class="hc-status '+(up?'up':'down')+'">'+(up?('正常 · HTTP '+s.status):(s.status===0?('异常 · '+(s.error||'不可达')):('HTTP '+s.status)))+'</div>'

// ---------- SVG 折线图 ----------
function lineChart(data){
  if(!data||!data.length) return '<div class="empty">暂无浏览数据</div>';
  const W=680,H=220,pad=34;
  const max=Math.max(...data.map(d=>d.s),1);
  const n=data.length;
  const X=i=>pad+i*((W-pad*2)/(n-1));
  const Y=v=>H-pad-(v/max)*(H-pad*2);
  const pts=data.map((d,i)=>X(i).toFixed(1)+','+Y(d.s).toFixed(1)).join(' ');
  const area=pad+','+(H-pad)+' '+pts+' '+(W-pad)+','+(H-pad);
  let grid='',labels='';
  for(let g=0;g<=3;g++){ const yv=Math.round(max*g/3); const y=Y(yv); grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="#eef2f7" stroke-width="1"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#94a3b8">'+yv+'</text>'; }
  // x 标签：首、中、尾
  const idxs=[0,Math.floor((n-1)/2),n-1];
  idxs.forEach(i=>{ const d=data[i]; labels+='<text x="'+X(i)+'" y="'+(H-10)+'" font-size="10" fill="#94a3b8" text-anchor="middle">'+String(d.day).slice(5)+'</text>'; });
  const last=data[n-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e88e5" stop-opacity=".22"/><stop offset="100%" stop-color="#1e88e5" stop-opacity="0"/></linearGradient></defs>'+
    grid+
    '<polygon points="'+area+'" fill="url(#cg)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#1e88e5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(n-1)+'" cy="'+Y(last.s)+'" r="3.5" fill="#1e88e5"/>'+
    labels+
    '</svg>';
}

// 多站点折线图（每条线一个 site，days 控制显示最近 N 个有数据日）
function multiLineChart(series, days = 14){
  if(!series||!series.length) return '<div class="empty">暂无浏览数据</div>';
  const W=680,H=240,pad=36;
  const daySet=new Set();
  series.forEach(s=>(s.points||[]).forEach(p=>daySet.add(p.day)));
  const allDays=Array.from(daySet).sort();
  const daysArr=allDays.slice(-days);
  const n=daysArr.length; if(!n) return '<div class="empty">暂无浏览数据</div>';
  const max=Math.max(1,...series.flatMap(s=>(s.points||[]).map(p=>p.s)));
  const X=i=>pad+i*((W-pad*2)/(n-1));
  const Y=v=>H-pad-(v/max)*(H-pad*2);
  let grid='',labels='';
  for(let g=0;g<=3;g++){const yv=Math.round(max*g/3);const y=Y(yv);grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="#eef2f7"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#94a3b8">'+yv+'</text>';}
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{labels+='<text x="'+X(i)+'" y="'+(H-10)+'" font-size="10" fill="#94a3b8" text-anchor="middle">'+daysArr[i].slice(5)+'</text>';});
  const dayIndex={}; daysArr.forEach((d,i)=>dayIndex[d]=i);
  let polylines='',legend='';
  series.forEach(s=>{
    const col=SITE_COLORS[s.site]||'#64748b';
    const pts=daysArr.map((d,i)=>{const p=(s.points||[]).find(p=>p.day===d);return X(i)+','+Y(p?p.s:0);}).join(' ');
    polylines+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    legend+='<span class="lg"><span class="lg-dot" style="background:'+col+'"></span>'+SITE_LABELS[s.site]+'</span>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'+grid+polylines+labels+'</svg><div class="legend">'+legend+'</div>';
}

  const fmt = function(ts){ if(!ts) return '—'; const d=new Date(Number(ts)); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };
  const statColor = { paid:'#0d9488', enrolled:'#2563eb', pending:'#d97706', deposit:'#d97706' };
  const statText = { paid:'已收款', enrolled:'已报名', pending:'待支付', deposit:'定金已付' };
  const sCur = function(c){ return (c==='CNY') ? '¥' : '$'; };
  const cnyOf = function(o){ return (o.cny_amount != null) ? Number(o.cny_amount) : (Number(o.amount)||0); };
  const fullCny = function(o){ return (o.currency==='CNY') ? (Number(o.full_price)||0) : (Number(o.full_price)||0)*RCJ_RATE; };

  // 汇总：已收款按全款计，定金按已收定金计
  const sum = all.reduce(function(a,o){ return a + (o.status==='paid' ? fullCny(o) : cnyOf(o)); }, 0);
  const paidN = all.filter(o=>o.status==='paid').length;
  const depN = all.filter(o=>o.status==='deposit').length;
  const pendingCount = all.filter(o=>o.status==='pending').length;
  const singN = all.filter(o=>o.source==='sing').length;

  // 筛选
  const kw = orderKeyword.trim().toLowerCase();
  const list = all.filter(function(o){
    if(orderStatusFilter!=='all' && (o.status||'')!==orderStatusFilter) return false;
    if(kw){
      const hay = [o.id,o.source,o.item,o.payer_email,o.contact_email,o.paypal_order_id].join(' ').toLowerCase();
      if(hay.indexOf(kw)===-1) return false;
    }
    return true;
  });

  let html = '';
  html += '<div class="panel"><h3>收款概览</h3><div style="display:flex;gap:16px;flex-wrap:wrap">'
    + '<div class="stat-card" style="flex:1;min-width:120px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px"><div class="fc-name">已收款(笔)</div><div class="fc-num" style="font-size:22px;color:#0d9488">'+(paidN+depN)+'</div></div>'
    + '<div class="stat-card" style="flex:1;min-width:120px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px"><div class="fc-name">已收款(金额)</div><div class="fc-num" style="font-size:22px;color:#0d9488">¥'+sum.toFixed(2)+'</div></div>'
    + '<div class="stat-card" style="flex:1;min-width:120px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px"><div class="fc-name">待支付</div><div class="fc-num" style="font-size:22px;color:#d97706">'+pendingCount+'</div></div>'
    + '<div class="stat-card" style="flex:1;min-width:120px;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:10px"><div class="fc-name">0元购报名</div><div class="fc-num" style="font-size:22px;color:#2563eb">'+singN+'</div></div>'
    + '</div></div>';

  // 工具条：搜索 + 状态筛选 + 导出
  html += '<div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'
    + '<input id="orderSearch" placeholder="搜索 邮箱 / 订单号 / 项目" value="'+esc2(orderKeyword)+'" oninput="orderKeyword=this.value;renderOrders()" style="flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">'
    + '<select id="orderStatus" onchange="orderStatusFilter=this.value;renderOrders()" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">'
    + '<option value="all">全部状态</option>'
    + '<option value="deposit"'+((orderStatusFilter==='deposit')?' selected':'')+'>定金已付</option>'
    + '<option value="paid"'+((orderStatusFilter==='paid')?' selected':'')+'>已收款</option>'
    + '<option value="pending"'+((orderStatusFilter==='pending')?' selected':'')+'>待支付</option>'
    + '</select>'
    + '<button class="btn" onclick="exportOrdersCSV()">⬇ 导出 CSV</button>'
    + '<span class="small muted">共 '+list.length+' 条</span>'
    + '</div>';

  if(!list.length){ html += '<p class="small muted">暂无匹配订单或报名记录。</p>'; }
  else {
    html += '<div style="overflow-x:auto"><table class="dt"><thead><tr><th>时间</th><th>来源</th><th>项目</th><th>金额(定金)</th><th>全款</th><th>余款</th><th>付款邮箱</th><th>联系邮箱</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    list.forEach(function(o){
      const c = statColor[o.status]||'#64748b';
      const isDeposit = (o.status==='deposit');
      const actHtml = (isDeposit
        ? '<button class="btn small" onclick="orderAct(\''+esc2(o.id)+'\',\'collect\')">收余款</button> '
        : '')
        + '<button class="btn small" style="color:var(--danger)" onclick="if(confirm(\'确认删除该订单？不可恢复\')) orderAct(\''+esc2(o.id)+'\',\'delete\')">删除</button>';
      html += '<tr><td>'+fmt(o.created)+'</td>'
        + '<td>'+esc2(o.source==='sing'?'0元购':'PayPal')+'</td>'
        + '<td>'+esc2(o.item)+'</td>'
        + '<td>'+(o.source==='sing'?'0':sCur(o.currency)+(Number(o.amount)||0).toFixed(2))+'</td>'
        + '<td>'+(o.full_price?((sCur(o.currency))+(Number(o.full_price)||0).toFixed(2)):'—')+'</td>'
        + '<td>'+(o.balance?((sCur(o.currency))+(Number(o.balance)||0).toFixed(2)):'—')+'</td>'
        + '<td>'+esc2(o.payer_email||'—')+'</td>'
        + '<td>'+esc2(o.contact_email||'—')+'</td>'
        + '<td><span style="color:'+c+';font-weight:600">'+esc2(statText[o.status]||o.status)+'</span></td>'
        + '<td>'+actHtml+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
  document.getElementById('pageTitle').textContent = '订单提醒';
}

async function orderAct(id, action){
  if(action==='collect' && !confirm('确认标记该订单「余款已收」？状态将变为「已收款」，余款清零。')) return;
  try{
    const r = await fetch('/api/admin/order', { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id, action }) });
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.ok){ alert('操作失败：'+(d.error||('HTTP '+r.status))); }
  }catch(e){ alert('操作失败：'+e.message); }
  loadData(true); // 强制绕过缓存刷新
}

function exportOrdersCSV(){
  const all = (DATA.orders || []);
  const head = ['时间','来源','项目','定金','全款','余款','币种','付款邮箱','联系邮箱','状态','PayPal单号'];
  const rows = all.map(function(o){
    const d = new Date(Number(o.created)); const p=n=>String(n).padStart(2,'0');
    const t = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    return [t, o.source==='sing'?'0元购':'PayPal', o.item||'', o.amount||'', o.full_price||'', o.balance||'', o.currency||'', o.payer_email||'', o.contact_email||'', o.status||'', o.paypal_order_id||''];
  });
  const csv = [head].concat(rows).map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[",\n]/.test(c)?('"'+c.replace(/"/g,'""')+'"'):c; }).join(','); }).join('\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rcj-orders-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

// ---------- 访问分析 ----------
function renderTraffic(){
  const d = DATA, AN = d.analytics || {series:[],allVisits:0};
  const seriesMap = {};
  (AN.series||[]).forEach(s => seriesMap[s.site] = s);
  const getS = function(site){ const s = seriesMap[site]; return s ? s.total : 0; };
  const getU = function(site){ const s = seriesMap[site]; return s ? s.u : 0; };
  const getD = function(site){ const s = seriesMap[site]; return s ? s.d : 0; };
  const esc2 = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };

  // 重点板块：exam 系列、shop 商店、api 页、facetalk
  var html = '';
  html += '<div class="traffic-focus">';
  // exam 系列（你懂的 / 辅警）
  html += '<div class="focus-card" style="--fc:#d81b60"><div class="fc-name">📚 Exam 系列（你懂的/辅警）</div>'
    + '<div class="fc-num">' + getS('exam') + '</div>'
    + '<div class="fc-sub">' + getU('exam') + ' 访客 · ' + getD('exam') + ' 天 · 占全站 ' + (AN.allVisits ? Math.round(getS('exam')/AN.allVisits*100) : 0) + '%</div></div>';
  // Shop 商店（独立 site，含浏览 + 订单）
  var shopOrders = (d.orders||[]).filter(function(o){ return o.source==='paypal'; }).length;
  html += '<div class="focus-card" style="--fc:#f59e0b"><div class="fc-name">🛒 Shop 商店</div>'
    + '<div class="fc-num">' + getS('shop') + '</div>'
    + '<div class="fc-sub">' + getU('shop') + ' 访客 · ' + getD('shop') + ' 天 · 订单 ' + shopOrders + ' 笔</div></div>';
  // 辅警（aux）
  html += '<div class="focus-card" style="--fc:#1e88e5"><div class="fc-name">🛡️ 辅警题库</div>'
    + '<div class="fc-num">' + getS('aux') + '</div>'
    + '<div class="fc-sub">' + getU('aux') + ' 访客 · ' + getD('aux') + ' 天</div></div>';
  // API 页（无独立 site，从 hub 总流量中估算暂无独立统计）
  html += '<div class="focus-card" style="--fc:#2e7d32"><div class="fc-name">🌐 RCJ Lab（含 API 页）</div>'
    + '<div class="fc-num">' + getS('hub') + '</div>'
    + '<div class="fc-sub">' + getU('hub') + ' 访客 · ' + getD('hub') + ' 天</div></div>';
  // FaceTalk
  html += '<div class="focus-card" style="--fc:#8e24aa"><div class="fc-name">💬 FaceTalk 面试搭子</div>'
    + '<div class="fc-num">' + getS('facetalk') + '</div>'
    + '<div class="fc-sub">' + getU('facetalk') + ' 访客 · ' + getD('facetalk') + ' 天</div></div>';
  html += '</div>';

  // 全站趋势图（复用原 overview 的 multiLineChart）
  var ALL_SITES = ['aux','xf','facetalk','hub','solospeak','letout','training','exam','shop'];
  var fullSeries = [];
  ALL_SITES.forEach(function(site){
    if(seriesMap[site]) fullSeries.push(seriesMap[site]);
    else fullSeries.push({site:site,points:[],total:0,u:0,d:0});
  });
  html += '<div class="panel"><div class="panel-hd"><h3>全站浏览趋势 <span class="tag">rcj-analytics-d1</span></h3>'
    + '<span class="range-tabs">'
    + '<button onclick="setTrendDays(7)" class="'+(trendDays===7?'active':'')+'">7天</button>'
    + '<button onclick="setTrendDays(14)" class="'+(trendDays===14?'active':'')+'">14天</button>'
    + '<button onclick="setTrendDays(30)" class="'+(trendDays===30?'active':'')+'">30天</button>'
    + '</span></div>' + multiLineChart(fullSeries, trendDays) + '</div>';

  // 各站点累计流量排序
  var sorted = ALL_SITES.slice().sort(function(a,b){ return getS(b) - getS(a); });
  html += '<div class="panel"><h3>各站点累计流量</h3><div class="site-stats">';
  var any = false;
  sorted.forEach(function(site){
    var s = seriesMap[site]; if(!s || !s.total) return;
    any = true;
    var col = {'aux':'#1e88e5','xf':'#ef6c00','facetalk':'#8e24aa','hub':'#2e7d32','solospeak':'#00897b','letout':'#6d4c41','training':'#c0ca33','exam':'#d81b60','shop':'#f59e0b'}[site]||'#64748b';
    var label = {'aux':'辅警题库','xf':'消防题库','facetalk':'FaceTalk','hub':'RCJ Lab','solospeak':'SoloSpeak','letout':'LetOut','training':'RCJ Training','exam':'Exam Hub','shop':'Shop 商店'}[site]||site;
    html += '<div class="ss-item"><span class="ss-dot" style="background:'+col+'"></span><span class="ss-name">'+label+'</span><span class="ss-num">'+s.total+'</span><span class="ss-sub">'+s.u+' 访客 / '+s.d+' 天</span></div>';
  });
  if(!any) html += '<div class="empty">暂无浏览数据（埋点已部署，访问各站点后开始累计）</div>';
  html += '</div></div>';

  // AI 调用数据（直接从 data.ai 取）
  var ai = d.ai || {total:0,ok:0,fail:0,successRate:0,byProject:{},byProvider:{}};
  html += '<div class="panel"><h3>🤖 AI 调用数据</h3><div class="stats">'
    + '<div class="stat ft"><div class="stat-num">' + ai.total + '</div><div class="stat-label">总调用</div></div>'
    + '<div class="stat ft"><div class="stat-num" style="color:var(--ok)">' + ai.ok + '</div><div class="stat-label">成功</div></div>'
    + '<div class="stat ft"><div class="stat-num" style="color:var(--danger)">' + ai.fail + '</div><div class="stat-label">失败</div></div>'
    + '<div class="stat ft"><div class="stat-num">' + ai.successRate + '%</div><div class="stat-label">成功率</div></div>'
    + '</div>';

  // 按项目/Provider 细分
  function renderTable(title, data){
    var h = '';
    var keys = Object.keys(data || {});
    if(!keys.length){ h += '<p class="small muted">暂无数据</p>'; return h; }
    h += '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="text-align:left;border-bottom:1px solid var(--line)"><th style="padding:8px">名称</th><th style="padding:8px">总量</th><th style="padding:8px">成功</th><th style="padding:8px">失败</th><th style="padding:8px">成功率</th></tr>';
    keys.sort(function(a,b){return (data[b].total||0)-(data[a].total||0);}).forEach(function(k){
      var s = data[k]; var rate = s.total ? Math.round(s.ok/s.total*100) : 0;
      h += '<tr style="border-bottom:1px solid var(--line)"><td style="padding:8px;font-weight:600">' + esc2(k||'unknown') + '</td><td style="padding:8px">' + s.total + '</td><td style="padding:8px;color:var(--ok)">' + s.ok + '</td><td style="padding:8px;color:var(--danger)">' + s.fail + '</td><td style="padding:8px">' + rate + '%</td></tr>';
    });
    h += '</table>';
    return h;
  }
  html += '<div class="grid-2">';
  html += '<div class="panel"><h4>按项目</h4><div class="panel-inset">' + renderTable('按项目', ai.byProject) + '</div></div>';
  html += '<div class="panel"><h4>按 Provider</h4><div class="panel-inset">' + renderTable('按 Provider', ai.byProvider) + '</div></div>';
  html += '</div></div>';

  // 数据源说明
  html += '<div class="panel"><h3>数据源</h3><p class="small muted">' + esc2(d.note) + '</p></div>';

  document.getElementById('content').innerHTML = html;
}

// ---------- 工具 ----------
function fmtDur(sec){
  if(!sec) return '—';
  if(sec<60) return sec+'″';
  const m=Math.floor(sec/60);
  if(m<60) return m+'′';
  const h=Math.floor(m/60);
  return h+'h'+(m%60)+'′';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(ts){ if(!ts)return '—'; const s=String(ts); let d; if(s.includes('T')||s.includes('-')) d=new Date(s); else if(s.length>12) d=new Date(Number(s)); else d=new Date(Number(s)*1000); if(isNaN(d))return '—'; const bj=new Date(d.getTime()+(d.getTimezoneOffset()*60000)+8*3600000); const p=n=>n<10?'0'+n:''+n; return bj.getFullYear()+'-'+p(bj.getMonth()+1)+'-'+p(bj.getDate())+' '+p(bj.getHours())+':'+p(bj.getMinutes())+' 北京'; }

// ---------- 启动（只探测一次，成功直接渲染，不再重复拉取）----------
(async function(){
  // 深链优先：带 ?conversation= 或 ?page=support 时进客服管理并定位
  const urlParams = new URLSearchParams(location.search);
  if(urlParams.get('conversation') || urlParams.get('page') === 'support'){
    currentPage = 'support';
    document.querySelectorAll('.sb-item').forEach(x => x.classList.toggle('active', x.dataset.page === 'support'));
    document.getElementById('pageTitle').textContent = '客服管理';
    if(urlParams.get('conversation')) window._pendingConvId = urlParams.get('conversation');
    document.getElementById('genSmall').textContent = '';
  }
  const r=await apiGet('/data');
  if(r.ok && r.data && r.data.ok){
    DATA=r.data;
    enterApp();
    document.getElementById('genTime').textContent='更新于 '+fmtTime(DATA.generatedAt);
    document.getElementById('genSmall').textContent=fmtTime(DATA.generatedAt);
    renderPage(currentPage);
  } else {
    showLogin();
  }
})();
</script>
