<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>RCJ Admin</title>
  <style>
    /* ── 移动端客服面板底部安全区适配 ── */
    @media (max-width: 768px) {
      /* 确保底部不被手机浏览器下栏遮挡（iOS Safari 100vh 陷阱） */
      .panel { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
      #content { padding-bottom: env(safe-area-inset-bottom, 0px); }
    }
    /* 高亮滚动到目标会话 */
    tr.conv-active-row td { background: rgba(245,179,85,.12) !important; border-left: 3px solid #f5b355; }
    /* Traffic重点板块 */
    .traffic-focus { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:16px; }
    .focus-card { background:linear-gradient(135deg,#141828,#10131f); border:1px solid rgba(255,255,255,.09); border-radius:12px; padding:16px 18px; position:relative; overflow:hidden; }
    .focus-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--fc,#f5b355); }
    .focus-card .fc-name { font-size:13px; color:var(--muted); margin-bottom:6px; }
    .focus-card .fc-num  { font-size:28px; font-weight:700; color:var(--text); line-height:1; }
    .focus-card .fc-sub  { font-size:11px; color:var(--ink-3,#6e6a60); margin-top:6px; }
    .focus-card.hot { background:linear-gradient(135deg,rgba(245,179,85,.16),rgba(245,179,85,.07)); border-color:rgba(245,179,85,.35); }
    .focus-card.hot .fc-num { color:#ffd78a; }
    :root{
      --bg:#0b0d16; --surface:#131627; --text:#f4f1ea; --muted:#8f8a7e; --line:rgba(255,255,255,.1);
      --sb:#0a0c14; --sb2:#171a2b; --sb-text:#c2bdb2; --sb-muted:#6e6a60;
      --accent:#f5b355; --accent-deep:#d9912f; --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
      --ft:#f5b355; --aux:#fb923c; --hub:#4ade80; --solo:#2dd4bf;
      --ink-3:#6e6a60;
      --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

    /* ===== 布局 ===== */
    .layout{display:flex;min-height:100vh}
    .sidebar{width:230px;flex-shrink:0;background:var(--sb);color:var(--sb-text);
      display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:30}
    .sb-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
    .sb-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
      display:flex;align-items:center;justify-content:center;font-weight:800;color:#13101a;font-size:14px}
    .sb-brand b{color:#fff;font-size:15px;display:block;line-height:1.2}
    .sb-brand small{color:var(--sb-muted);font-size:11px}
    .sb-nav{padding:12px 10px;flex:1;overflow-y:auto}
    .sb-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:var(--sb-text);
      cursor:pointer;font-size:14px;font-weight:500;margin-bottom:3px;transition:background .15s}
    .sb-item .ico{width:20px;text-align:center;font-size:16px}
    .sb-item:hover{background:var(--sb2)}
    .sb-item.active{background:var(--accent);color:#13101a}
    .sb-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:var(--sb-muted)}
    .sb-foot button{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px;padding:0}
    .sb-foot button:hover{color:#f87171}

    .main{margin-left:230px;flex:1;min-width:0;display:flex;flex-direction:column}
    .topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
    .topbar h1{font-size:17px;font-weight:700}
    .topbar .acts{display:flex;gap:10px;align-items:center}
    .topbar .gen{font-size:12px;color:var(--muted)}
    .btn{padding:8px 15px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);
      color:var(--text);border-radius:9px;cursor:pointer;transition:.15s}
    .btn:hover{background:var(--bg)}
    .btn.primary{background:var(--accent);color:#13101a;border-color:var(--accent)}
    .btn.primary:hover{background:var(--accent-deep)}
    .content{padding:24px;flex:1}
    .mobile-bar{display:none}

    /* ===== 卡片 / 指标 ===== */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
    .stat.ft::before{background:var(--ft)} .stat.aux::before{background:var(--aux)} .stat.hub::before{background:var(--hub)}
    .stat-num{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
    .stat-label{font-size:12px;color:var(--muted);margin-top:3px}
    .stat-sub{font-size:11px;color:#94a3b8;margin-top:2px}

    .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}
    .panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .panel h3 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
    .dt{width:100%;border-collapse:collapse;font-size:13px}
    .dt th,.dt td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
    .dt th{color:var(--muted);font-weight:600;background:var(--bg)}
    .dt tbody tr:hover{background:var(--bg)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

    /* 趋势图 */
    .chart-wrap{width:100%}
    svg.chart{width:100%;height:auto;display:block}
    .site-stats{display:flex;flex-direction:column;gap:8px;margin-top:4px}
    .ss-item{display:flex;align-items:center;gap:10px;font-size:13px}
    .ss-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
    .ss-name{width:120px;color:var(--text)}
    .ss-num{font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
    .ss-sub{color:var(--ink-3);font-size:12px}
    .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
    .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sb-text)}
    .lg-dot{width:10px;height:10px;border-radius:50%}

    /* entries形（城市） */
    .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:9px;font-size:13px}
    .bar-label{flex:0 0 86px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{flex:1;background:rgba(255,255,255,.08);border-radius:999px;height:15px;overflow:hidden}
    .bar-fill{height:100%;background:var(--aux);border-radius:999px;transition:width .5s}
    .bar-val{flex:0 0 34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

    /* 表格 */
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--line)}
    td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
    tr:last-child td{border-bottom:none}
    .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:7px}
    .pill.ok{background:rgba(74,222,128,.14);color:#6ee7a0} .pill.warn{background:rgba(251,191,36,.14);color:#fcd34d}
    .pill.gray{background:rgba(255,255,255,.08);color:var(--sb-text)} .pill.blue{background:rgba(96,165,250,.16);color:#93c5fd}
    .pill.ft{background:rgba(245,179,85,.14);color:#ffd78a} .pill.aux{background:rgba(251,146,60,.14);color:#fdba74}
    .mono{font-variant-numeric:tabular-nums}
    .muted{color:var(--muted)} .small{font-size:12px}
    .empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}

    /* 登录屏 */
    .login-wrap{position:fixed;inset:0;background:linear-gradient(135deg,#0b0d16,#10162a);display:flex;align-items:center;justify-content:center;z-index:50}
    .login-card{background:#131627;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:34px 32px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .login-card .lc-logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
      display:flex;align-items:center;justify-content:center;font-weight:800;color:#13101a;font-size:18px;margin-bottom:14px}
    .login-card h2{font-size:19px;margin-bottom:4px}
    .login-card p{color:var(--muted);font-size:13px;margin-bottom:20px}
    .login-card input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:10px;outline:none;background:#0e1120;color:var(--text)}
    .login-card input:focus{border-color:var(--accent)}
    .login-card button{width:100%;margin-top:14px;padding:12px;font-size:15px;font-weight:700;background:var(--accent);color:#13101a;border:none;border-radius:10px;cursor:pointer}
    .login-card button:hover{background:var(--accent-deep)}
    .login-card .err{background:rgba(248,113,113,.12);color:#fca5a5;font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:14px}


    .site-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
    .site-card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:.15s}
    .site-card:hover{border-color:var(--accent);transform:translateY(-2px)}
    .site-card .sc-ico{font-size:22px;margin-bottom:8px}
    .site-card .sc-name{font-weight:700;font-size:15px;color:var(--text)}
    .site-card .sc-url{font-size:12px;color:var(--accent);word-break:break-all;margin-top:2px}
    .site-card .sc-desc{font-size:12px;color:var(--muted);margin-top:6px}

    .loading{padding:60px;text-align:center;color:var(--muted)}
    .err-box{background:rgba(248,113,113,.12);color:#fca5a5;padding:14px 18px;border-radius:11px;font-size:14px;margin-bottom:18px}

    /* Site Status */
    .hc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .hc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
    .hc-dot{width:13px;height:13px;border-radius:50%;flex:0 0 auto}
    .hc-dot.up{background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.13)}
    .hc-dot.down{background:var(--danger);box-shadow:0 0 0 4px rgba(220,38,38,.13);animation:pulse 1.4s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .hc-body{min-width:0}
    .hc-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
    .hc-url{font-size:11px;color:var(--muted);word-break:break-all;margin-top:1px}
    .hc-status{font-size:12px;margin-top:3px;font-weight:600}
    .hc-status.up{color:#4ade80} .hc-status.down{color:#f87171}
    .hc-sum{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:14px;color:var(--muted)}
    .hc-sum b{font-variant-numeric:tabular-nums}
    .hc-sum .okn{color:#4ade80} .hc-sum .badn{color:#f87171}

    /* Business overview卡（Site Status页） */
    .biz-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .biz-hd{font-weight:700;font-size:15px;margin-bottom:10px;color:var(--text)}
    .biz-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
    .biz-row span{color:var(--muted)} .biz-row b{font-variant-numeric:tabular-nums;font-size:15px}
    .biz-ms{font-size:12.5px;margin-top:9px;padding:8px 10px;border-radius:8px;line-height:1.5;background:var(--bg)}
    .biz-ms b{color:var(--text)} .biz-ms.ms-ok{background:rgba(74,222,128,.1)} .biz-ms.ms-ok b{color:#4ade80}
    .biz-ms.ms-warn{background:rgba(217,119,6,.1)} .biz-ms.ms-warn b{color:#b45309}
    .biz-ms.ms-info{background:rgba(37,99,235,.07)} .biz-ms.ms-info b{color:#1d4ed8}
    .biz-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent);color:#13101a;margin-left:6px;vertical-align:middle}

    /* 趋势天数切换 */
    .range-tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
    .range-tabs button{border:none;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;cursor:pointer}
    .range-tabs button.active{background:var(--accent);color:#13101a}
    .panel-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .panel-hd h3{margin-bottom:0}

    @media(max-width:820px){
      .sidebar{transform:translateX(-100%);transition:transform .2s;width:220px}
      .sidebar.open{transform:none}
      .main{margin-left:0}
      .mobile-bar{display:flex;align-items:center;gap:12px;background:var(--sb);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:25}
      .mobile-bar .mb-brand{font-weight:700;font-size:15px}
      .mobile-bar .mb-menu{margin-left:auto;font-size:22px;cursor:pointer}
      .grid-2{grid-template-columns:1fr}
      .sidebar{box-shadow:4px 0 24px rgba(0,0,0,.3)}
    }

    /* 萤火虫暖黄光点层 */
    .fireflies{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .fireflies i{position:absolute;bottom:-12px;border-radius:50%;background:radial-gradient(circle,rgba(255,238,196,.98) 0%,rgba(247,212,138,.5) 42%,rgba(247,212,138,0) 74%);opacity:0;will-change:transform,opacity;animation:ffRise var(--t,11s) ease-in-out var(--d,0s) infinite}
    @keyframes ffRise{0%{transform:translate3d(0,0,0) scale(.7);opacity:0}14%{opacity:var(--o,.8)}55%{opacity:var(--o2,.4)}100%{transform:translate3d(var(--dx,30px),-96vh,0) scale(1.15);opacity:0}}
    .layout{position:relative;z-index:1}
    @media(prefers-reduced-motion:reduce){.fireflies i{animation:none!important}}
  </style>
</head>
<body>

<div class="fireflies" id="fireflies" aria-hidden="true"></div>

<!-- 登录屏 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="lc-logo">RCJ</div>
    <h2>Admin Console</h2>
    <p>Manage all RCJ site data · one sign-in</p>
    <div class="err" id="loginErr" style="display:none"></div>
    <input type="password" id="pwInput" placeholder="Admin password" autofocus />
    <button onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- 主框架 -->
<div class="layout" id="app" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">RCJ</div>
      <div><b>RCJ Admin</b><small>Unified Admin</small></div>
    </div>
    <nav class="sb-nav" id="nav">
      <div class="sb-item active" data-page="health"><span class="ico">🩺</span>Site Status</div>
      <div class="sb-item" data-page="traffic"><span class="ico">📊</span>Traffic</div>
      <div class="sb-item" data-page="support"><span class="ico">💬</span>Support</div>
      <div class="sb-item" data-page="blog"><span class="ico">📝</span>Blog Admin</div>
      <div class="sb-item" data-page="aux"><span class="ico">🛡️</span>Auxiliary Police</div>
      <div class="sb-item" data-page="facetalk"><span class="ico">💬</span>FaceTalk</div>
      <div class="sb-item" data-page="orders"><span class="ico">💰</span>Orders</div>
    </nav>
    <div class="sb-foot">
      <div id="genTime">—</div>
      <button onclick="doLogout()">Sign out</button>
    </div>
  </aside>

  <div class="main">
    <div class="mobile-bar">
      <span class="mb-brand">RCJ Admin</span>
      <span class="mb-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</span>
    </div>
    <div class="topbar">
      <h1 id="pageTitle">Site Status</h1>
      <div class="acts">
        <span class="gen" id="genSmall"></span>
        <button class="btn" onclick="loadData()">↻ Refresh</button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="loading">Loading…</div>
    </div>
  </div>
</div>

<script>
const API = '/api/admin';
const SITE_COLORS = { aux:'#60a5fa', xf:'#fb923c', facetalk:'#c084fc', hub:'#4ade80', solospeak:'#2dd4bf', letout:'#d6a68a', training:'#facc15', exam:'#f472b6', shop:'#fbbf24', voice:'#f5b355' };
const SITE_LABELS = { aux:'Auxiliary Police Bank', xf:'Fire Service Bank', facetalk:'FaceTalk', hub:'RCJ Lab', solospeak:'SoloSpeak', letout:'LetOut', training:'RCJ Training', exam:'Exam Hub', shop:'Shop', voice:'Voice' };
let DATA = null;
// 登录态由 HttpOnly cookie（rcj_admin）接管，1 days过期；不存任何密码于 localStorage

// ---------- 统一请求封装（含 8s 超时 + 错误归一）----------
async function apiReq(path, opts = {}) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), opts.timeout || 8000);
  try {
    const res = await fetch(API + path, Object.assign({ cache: 'no-store' }, opts, { signal: ac.signal }));
    let data = null;
    try { data = await res.json(); } catch (_) {}
    return { ok: res.ok, status: res.status, data };
  } catch (e) {
    return { ok: false, status: 0, data: null, error: (e && e.name === 'AbortError') ? 'Request timeout' : (e && e.message) || 'Network error' };
  } finally { clearTimeout(timer); }
}
const apiGet = (p, o) => apiReq(p, o);
const apiPost = (p, body, o) => apiReq(p, Object.assign({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, o));

function showLogin() {
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ---------- 登录 ----------
async function doLogin(){
  const v = document.getElementById('pwInput').value.trim();
  if(!v) return;
  const e = document.getElementById('loginErr'); e.style.display = 'none';
  const r = await apiPost('/login', { password: v });
  if(r.ok && r.data && r.data.ok){ enterApp(); loadData(); }
  else { e.style.display = 'block'; e.textContent = (r.data && r.data.error) || r.error || 'Sign-in failed'; }
}
function doLogout(){
  fetch(API+'/logout',{method:'POST'}).finally(()=>location.reload());
}
function enterApp(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('app').style.display='flex';
}
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// ---------- 数据加载 ----------
async function loadData(force){
  const c=document.getElementById('content');
  c.innerHTML='<div class="loading">Loading…</div>';
  const r=await apiGet('/data'+(force?'?nocache=1':''));
  if(r.status===401){ showLogin(); return; }
  if(!r.ok || !r.data || !r.data.ok){
    const msg=(r.data && r.data.error) || r.error || ('HTTP ' + r.status) || 'Load failed';
    c.innerHTML='<div class="err-box">'+esc(msg)+'<div style="margin-top:12px"><button class="btn" onclick="loadData()">↻ Retry</button></div></div>';
    return;
  }
  DATA=r.data;
  document.getElementById('genTime').textContent='Updated '+fmtTime(DATA.generatedAt);
  document.getElementById('genSmall').textContent=fmtTime(DATA.generatedAt);
  renderPage(currentPage);
}

// ---------- 导航 ----------
let currentPage='health';
document.getElementById('nav').addEventListener('click',e=>{
  const it=e.target.closest('.sb-item'); if(!it)return;
  document.querySelectorAll('.sb-item').forEach(x=>x.classList.toggle('active',x===it));
  currentPage=it.dataset.page;
  document.getElementById('pageTitle').textContent=it.textContent.trim();
  document.getElementById('sidebar').classList.remove('open');
  renderPage(currentPage);
});

// 程序化切换页面（供卡片内按钮跳转用，如Wall「查看全部」、Sing to Me Review）
window.switchPage = function(p){
  currentPage=p;
  document.querySelectorAll('.sb-item').forEach(x=>x.classList.toggle('active', x.dataset.page===p));
  renderPage(p);
};

function renderPage(p){
  if(!DATA){ document.getElementById('content').innerHTML='<div class="loading">Loading…</div>'; return; }  if(p==='overview') renderOverview();
  else if(p==='health') renderHealth();
  else if(p==='blog') renderBlog();

function renderAI(){
  const d = DATA.ai || { total:0, ok:0, fail:0, successRate:0, byProject:{}, byProvider:{}, byDay:{} };
  const content = document.getElementById('content');
  document.getElementById('pageTitle').textContent = 'AI Monitor';
  let html = '';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-num">'+d.total+'</div><div class="stat-label">Total calls</div></div>';
  html += '<div class="stat"><div class="stat-num" style="color:var(--ok)">'+d.ok+'</div><div class="stat-label">OK</div></div>';
  html += '<div class="stat"><div class="stat-num" style="color:var(--danger)">'+d.fail+'</div><div class="stat-label">Fail</div></div>';
  html += '<div class="stat"><div class="stat-num">'+d.successRate+'%</div><div class="stat-label">Success rate</div></div>';
  html += '</div>';
  function renderTable(title, tag, data){
    let h = '<div class="panel"><h3>'+title+' <span class="tag">'+tag+'</span></h3>';
    const keys = Object.keys(data || {});
    if(!keys.length){ h += '<p class="small muted">No data yet (the table is created on the first AI call after deploy)</p>'; }
    else {
      h += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
      h += '<tr style="text-align:left;border-bottom:1px solid var(--line)"><th style="padding:8px">Name</th><th style="padding:8px">Total</th><th style="padding:8px">OK</th><th style="padding:8px">Fail</th><th style="padding:8px">Success rate</th></tr>';
      keys.sort(function(a,b){return (data[b].total||0)-(data[a].total||0);}).forEach(function(k){
        var s = data[k]; var rate = s.total ? Math.round(s.ok/s.total*100) : 0;
        h += '<tr style="border-bottom:1px solid var(--line)"><td style="padding:8px;font-weight:600">'+esc(k||'unknown')+'</td><td style="padding:8px">'+s.total+'</td><td style="padding:8px;color:var(--ok)">'+s.ok+'</td><td style="padding:8px;color:var(--danger)">'+s.fail+'</td><td style="padding:8px">'+rate+'%</td></tr>';
      });
      h += '</table>';
    }
    h += '</div>';
    return h;
  }
  html += renderTable('Calls by project', 'by project', d.byProject);
  html += renderTable('Calls by channel', 'by provider', d.byProvider);
  // Last-14-day trend
  html += '<div class="panel"><h3>Last-14-day trend <span class="tag">daily</span></h3>';
  var days = Object.keys(d.byDay || {}).sort();
  if(!days.length){ html += '<p class="small muted">No data</p>'; }
  else {
    var max = 1; days.forEach(function(day){ if((d.byDay[day].total||0)>max) max=d.byDay[day].total; });
    html += '<div style="display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px">';
    days.forEach(function(day){
      var s = d.byDay[day]; var h = Math.round((s.total||0)/max*100);
      var rate = s.total ? Math.round(s.ok/s.total*100) : 0;
      html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px" title="'+day+': '+s.total+' calls '+rate+'%">';
      html += '<div style="width:100%;background:var(--accent);border-radius:3px 3px 0 0;height:'+h+'%;min-height:'+(s.total?2:0)+'px"></div>';
      html += '<span style="font-size:9px;color:var(--muted);transform:rotate(-45deg);white-space:nowrap">'+day.slice(5)+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  content.innerHTML = html;
}

function calcTodayTop(seriesMap){
  return Object.values(seriesMap)
    .map(s=>{
      const pts=s.points||[];
      const last=pts.length?pts[pts.length-1]:null;
      return { site:s.site, day:last?last.day:'—', n:last?Number(last.s)||0:0 };
    })
    .sort((a,b)=>b.n-a.n);
}

// ---------- Notification channels self-test（真实发送，逐通道报成败）----------
window.runNotifyTest = async function(){
  var btn=document.getElementById('ntBtn'), msg=document.getElementById('ntMsg'), box=document.getElementById('ntResult');
  if(!btn||!box) return;
  btn.disabled=true; if(msg) msg.textContent='Sending… results in ~3s'; box.innerHTML='';
  try{
    var r=await fetch('/api/admin/notify-test',{method:'POST',cache:'no-store'});
    if(r.status===401){ showLogin(); return; }
    var d=null; try{ d=await r.json(); }catch(_){}
    if(!d||!d.ok){
      box.innerHTML='<div class="err-box">'+esc((d&&d.error)||('HTTP '+r.status))+'</div>';
      if(msg) msg.textContent=''; return;
    }
    var LABEL={shop:'Shop order alerts', supportly:'Support alerts (supportly)'};
    var html='';
    (d.targets||[]).forEach(function(t){
      var name=t.target||'?';
      html+='<div style="border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px">'
        +'<div class="small" style="font-weight:700;margin-bottom:6px">'+esc(LABEL[name]||name)+'</div>';
      if(t.ok===false||t.error){
        html+='<div class="small" style="color:var(--danger)">× '+esc(t.error||'Call failed')+'</div>';
      } else {
        (t.channels||[]).forEach(function(c){
          var tone=c.status==='ok'?'var(--ok)':(c.status==='fail'?'var(--danger)':'var(--muted)');
          var mark=c.status==='ok'?'Up':(c.status==='fail'?'Down':'Not configured');
          html+='<div class="small" style="display:flex;gap:10px;align-items:baseline;padding:2px 0">'
            +'<span style="color:'+tone+';font-weight:700;min-width:48px">'+mark+'</span>'
            +'<span style="min-width:112px">'+esc(c.label||c.id)+'</span>'
            +'<span class="muted">'+esc(c.detail||'')+'</span></div>';
        });
      }
      html+='</div>';
    });
    box.innerHTML=html||'<div class="empty">No result</div>';
    if(msg) msg.textContent=d.failed?(' '+d.failed+' channels failed'):(d.unreachable?(' '+d.unreachable+' sites unreachable'):'All channels OK');
  }catch(e){
    box.innerHTML='<div class="err-box">'+esc(e&&e.message?e.message:'Network error')+'</div>';
    if(msg) msg.textContent='';
  }finally{ btn.disabled=false; }
};

// ---------- SVG 折线图 ----------
function lineChart(data){
  if(!data||!data.length) return '<div class="empty">No visit data</div>';
  const W=680,H=220,pad=34;
  const max=Math.max(...data.map(d=>d.s),1);
  const n=data.length;
  const X=i=>pad+i*((W-pad*2)/(n-1));
  const Y=v=>H-pad-(v/max)*(H-pad*2);
  const pts=data.map((d,i)=>X(i).toFixed(1)+','+Y(d.s).toFixed(1)).join(' ');
  const area=pad+','+(H-pad)+' '+pts+' '+(W-pad)+','+(H-pad);
  let grid='',labels='';
  for(let g=0;g<=3;g++){ const yv=Math.round(max*g/3); const y=Y(yv); grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="rgba(255,255,255,.08)" stroke-width="1"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#8f8a7e">'+yv+'</text>'; }
  // x 标签：首、中、尾
  const idxs=[0,Math.floor((n-1)/2),n-1];
  idxs.forEach(i=>{ const d=data[i]; labels+='<text x="'+X(i)+'" y="'+(H-10)+'" font-size="10" fill="#8f8a7e" text-anchor="middle">'+String(d.day).slice(5)+'</text>'; });
  const last=data[n-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5b355" stop-opacity=".28"/><stop offset="100%" stop-color="#f5b355" stop-opacity="0"/></linearGradient></defs>'+
    grid+
    '<polygon points="'+area+'" fill="url(#cg)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#f5b355" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(n-1)+'" cy="'+Y(last.s)+'" r="3.5" fill="#f5b355"/>'+
    labels+
    '</svg>';
}

// 多站点折线图（每条线一个 site，days 控制显示最近 N 个有数据日）
function multiLineChart(series, days = 14){
  if(!series||!series.length) return '<div class="empty">No visit data</div>';
  const W=680,H=240,pad=36;
  const daySet=new Set();
  series.forEach(s=>(s.points||[]).forEach(p=>daySet.add(p.day)));
  const allDays=Array.from(daySet).sort();
  const daysArr=allDays.slice(-days);
  const n=daysArr.length; if(!n) return '<div class="empty">No visit data</div>';
  const max=Math.max(1,...series.flatMap(s=>(s.points||[]).map(p=>p.s)));
  const X=i=>pad+i*((W-pad*2)/(n-1));
  const Y=v=>H-pad-(v/max)*(H-pad*2);
  let grid='',labels='';
  for(let g=0;g<=3;g++){const yv=Math.round(max*g/3);const y=Y(yv);grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(W-pad)+'" y2="'+y+'" stroke="rgba(255,255,255,.08)"/><text x="4" y="'+(y+4)+'" font-size="10" fill="#8f8a7e">'+yv+'</text>';}
  [0,Math.floor((n-1)/2),n-1].forEach(i=>{labels+='<text x="'+X(i)+'" y="'+(H-10)+'" font-size="10" fill="#8f8a7e" text-anchor="middle">'+daysArr[i].slice(5)+'</text>';});
  const dayIndex={}; daysArr.forEach((d,i)=>dayIndex[d]=i);
  let polylines='',legend='';
  series.forEach(s=>{
    const col=SITE_COLORS[s.site]||'#64748b';
    const pts=daysArr.map((d,i)=>{const p=(s.points||[]).find(p=>p.day===d);return X(i)+','+Y(p?p.s:0);}).join(' ');
    polylines+='<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    legend+='<span class="lg"><span class="lg-dot" style="background:'+col+'"></span>'+SITE_LABELS[s.site]+'</span>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'+grid+polylines+labels+'</svg><div class="legend">'+legend+'</div>';
}

    if(!r.ok || !d.ok){ alert('Action failed: '+(d.error||('HTTP '+r.status))); }
  }catch(e){ alert('Action failed: '+e.message); }
  loadData(true); // 强制绕过缓存刷新
}

function exportOrdersCSV(){
  const all = (DATA.orders || []);
  const head = ['Time','Source','Item','Deposit','Full','Balance','Currency','Pay email','Contact email','Status','PayPal ID'];
  const rows = all.map(function(o){
    const d = new Date(Number(o.created)); const p=n=>String(n).padStart(2,'0');
    const t = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    return [t, o.source==='sing'?'Sing-to-get':'PayPal', o.item||'', o.amount||'', o.full_price||'', o.balance||'', o.currency||'', o.payer_email||'', o.contact_email||'', o.status||'', o.paypal_order_id||''];
  });
  const csv = [head].concat(rows).map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[",\n]/.test(c)?('"'+c.replace(/"/g,'""')+'"'):c; }).join(','); }).join('\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'rcj-orders-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

// ---------- Traffic ----------
function renderTraffic(){
  const d = DATA, AN = d.analytics || {series:[],allVisits:0};
  const seriesMap = {};
  (AN.series||[]).forEach(s => seriesMap[s.site] = s);
  const getS = function(site){ const s = seriesMap[site]; return s ? s.total : 0; };
  const getU = function(site){ const s = seriesMap[site]; return s ? s.u : 0; };
  const getD = function(site){ const s = seriesMap[site]; return s ? s.d : 0; };
  const esc2 = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };

  // 重点板块：exam 系列、shop 商店、api 页、facetalk
  var html = '';
  html += '<div class="traffic-focus">';
  // exam 系列（You-know-what / 辅警）
  html += '<div class="focus-card" style="--fc:#f472b6"><div class="fc-name">📚 Exam series (you-know / aux)</div>'
    + '<div class="fc-num">' + getS('exam') + '</div>'
    + '<div class="fc-sub">' + getU('exam') + ' visitors · ' + getD('exam') + ' days · of all-site ' + (AN.allVisits ? Math.round(getS('exam')/AN.allVisits*100) : 0) + '%</div></div>';
  // Shop（独立 site，含Visits + 订单）
  var shopOrders = (d.orders||[]).filter(function(o){ return o.source==='paypal'; }).length;
  html += '<div class="focus-card" style="--fc:#fbbf24"><div class="fc-name">🛒 Shop</div>'
    + '<div class="fc-num">' + getS('shop') + '</div>'
    + '<div class="fc-sub">' + getU('shop') + ' visitors · ' + getD('shop') + ' days · orders ' + shopOrders + ' orders</div></div>';
  // 辅警（aux）
  html += '<div class="focus-card" style="--fc:#60a5fa"><div class="fc-name">🛡️ Auxiliary Police</div>'
    + '<div class="fc-num">' + getS('aux') + '</div>'
    + '<div class="fc-sub">' + getU('aux') + ' visitors · ' + getD('aux') + ' days</div></div>';
  // API 页（无独立 site，从 hub 总流量中估算暂无独立统计）
  html += '<div class="focus-card" style="--fc:#4ade80"><div class="fc-name">🌐 RCJ Lab (incl. API pages)</div>'
    + '<div class="fc-num">' + getS('hub') + '</div>'
    + '<div class="fc-sub">' + getU('hub') + ' visitors · ' + getD('hub') + ' days</div></div>';
  // FaceTalk
  html += '<div class="focus-card" style="--fc:#c084fc"><div class="fc-name">💬 FaceTalk interview partner</div>'
    + '<div class="fc-num">' + getS('facetalk') + '</div>'
    + '<div class="fc-sub">' + getU('facetalk') + ' visitors · ' + getD('facetalk') + ' days</div></div>';
  html += '</div>';

  // 全站趋势图（复用原 overview 的 multiLineChart）
  var ALL_SITES = ['aux','xf','facetalk','hub','solospeak','letout','training','exam','shop'];
  var fullSeries = [];
  ALL_SITES.forEach(function(site){
    if(seriesMap[site]) fullSeries.push(seriesMap[site]);
    else fullSeries.push({site:site,points:[],total:0,u:0,d:0});
  });
  html += '<div class="panel"><div class="panel-hd"><h3>All-site traffic trend <span class="tag">rcj-analytics-d1</span></h3>'
    + '<span class="range-tabs">'
    + '<button onclick="setTrendDays(7)" class="'+(trendDays===7?'active':'')+'">7d</button>'
    + '<button onclick="setTrendDays(14)" class="'+(trendDays===14?'active':'')+'">14d</button>'
    + '<button onclick="setTrendDays(30)" class="'+(trendDays===30?'active':'')+'">30d</button>'
    + '</span></div>' + multiLineChart(fullSeries, trendDays) + '</div>';

  // All-time traffic by site排序
  var sorted = ALL_SITES.slice().sort(function(a,b){ return getS(b) - getS(a); });
  html += '<div class="panel"><h3>All-time traffic by site</h3><div class="site-stats">';
  var any = false;
  sorted.forEach(function(site){
    var s = seriesMap[site]; if(!s || !s.total) return;
    any = true;
    var col = {'aux':'#60a5fa','xf':'#fb923c','facetalk':'#c084fc','hub':'#4ade80','solospeak':'#2dd4bf','letout':'#d6a68a','training':'#facc15','exam':'#f472b6','shop':'#fbbf24'}[site]||'#64748b';
    var label = {'aux':'Auxiliary Police','xf':'Fire Service','facetalk':'FaceTalk','hub':'RCJ Lab','solospeak':'SoloSpeak','letout':'LetOut','training':'RCJ Training','exam':'Exam Hub','shop':'Shop'}[site]||site;
    html += '<div class="ss-item"><span class="ss-dot" style="background:'+col+'"></span><span class="ss-name">'+label+'</span><span class="ss-num">'+s.total+'</span><span class="ss-sub">'+s.u+' visitors / '+s.d+' days</span></div>';
  });
  if(!any) html += '<div class="empty">No data yet (tracking is live — visit the sites to start accumulating)</div>';
  html += '</div></div>';

  // AI call data（直接从 data.ai 取）
  var ai = d.ai || {total:0,ok:0,fail:0,successRate:0,byProject:{},byProvider:{}};
  html += '<div class="panel"><h3>🤖 AI call data</h3><div class="stats">'
    + '<div class="stat ft"><div class="stat-num">' + ai.total + '</div><div class="stat-label">Total calls</div></div>'
    + '<div class="stat ft"><div class="stat-num" style="color:var(--ok)">' + ai.ok + '</div><div class="stat-label">OK</div></div>'
    + '<div class="stat ft"><div class="stat-num" style="color:var(--danger)">' + ai.fail + '</div><div class="stat-label">Fail</div></div>'
    + '<div class="stat ft"><div class="stat-num">' + ai.successRate + '%</div><div class="stat-label">Success rate</div></div>'
    + '</div>';

  // By project/Provider 细分
  function renderTable(title, data){
    var h = '';
    var keys = Object.keys(data || {});
    if(!keys.length){ h += '<p class="small muted">No data</p>'; return h; }
    h += '<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="text-align:left;border-bottom:1px solid var(--line)"><th style="padding:8px">Name</th><th style="padding:8px">Total</th><th style="padding:8px">OK</th><th style="padding:8px">Fail</th><th style="padding:8px">Success rate</th></tr>';
    keys.sort(function(a,b){return (data[b].total||0)-(data[a].total||0);}).forEach(function(k){
      var s = data[k]; var rate = s.total ? Math.round(s.ok/s.total*100) : 0;
      h += '<tr style="border-bottom:1px solid var(--line)"><td style="padding:8px;font-weight:600">' + esc2(k||'unknown') + '</td><td style="padding:8px">' + s.total + '</td><td style="padding:8px;color:var(--ok)">' + s.ok + '</td><td style="padding:8px;color:var(--danger)">' + s.fail + '</td><td style="padding:8px">' + rate + '%</td></tr>';
    });
    h += '</table>';
    return h;
  }
  html += '<div class="grid-2">';
  html += '<div class="panel"><h4>By project</h4><div class="panel-inset">' + renderTable('By project', ai.byProject) + '</div></div>';
  html += '<div class="panel"><h4>By Provider</h4><div class="panel-inset">' + renderTable('By Provider', ai.byProvider) + '</div></div>';
  html += '</div></div>';

  // Data source
  html += '<div class="panel"><h3>Data source</h3><p class="small muted">' + esc2(d.note) + '</p></div>';

  document.getElementById('content').innerHTML = html;
}

// ---------- 工具 ----------
function fmtDur(sec){
  if(!sec) return '—';
  if(sec<60) return sec+'″';
  const m=Math.floor(sec/60);
  if(m<60) return m+'′';
  const h=Math.floor(m/60);
  return h+'h'+(m%60)+'′';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtTime(ts){ if(!ts)return '—'; const s=String(ts); let d; if(s.includes('T')||s.includes('-')) d=new Date(s); else if(s.length>12) d=new Date(Number(s)); else d=new Date(Number(s)*1000); if(isNaN(d))return '—'; const bj=new Date(d.getTime()+(d.getTimezoneOffset()*60000)+8*3600000); const p=n=>n<10?'0'+n:''+n; return bj.getFullYear()+'-'+p(bj.getMonth()+1)+'-'+p(bj.getDate())+' '+p(bj.getHours())+':'+p(bj.getMinutes())+' BJ'; }

(async function(){
  // 深链优先：带 ?conversation= 或 ?page=support 时进Support Console并定位
  const urlParams = new URLSearchParams(location.search);
  if(urlParams.get('conversation') || urlParams.get('page') === 'support'){
    currentPage = 'support';
    document.querySelectorAll('.sb-item').forEach(x => x.classList.toggle('active', x.dataset.page === 'support'));
    document.getElementById('pageTitle').textContent = 'Support Console';
    if(urlParams.get('conversation')) window._pendingConvId = urlParams.get('conversation');
    document.getElementById('genSmall').textContent = '';
  }
  // 深链：?page=sing（Sing to Me Review语音）/ ?page=orders（Orders）——通知邮件/TG 直达用
  const deepPage = urlParams.get('page');
  if(deepPage === 'sing' || deepPage === 'orders'){
    currentPage = deepPage;
    document.querySelectorAll('.sb-item').forEach(x => x.classList.toggle('active', x.dataset.page === deepPage));
    document.getElementById('pageTitle').textContent = deepPage === 'sing' ? 'Sing to Me · Review' : 'Orders';
    document.getElementById('genSmall').textContent = '';
  }
  const r=await apiGet('/data');
  if(r.ok && r.data && r.data.ok){
    DATA=r.data;
    enterApp();
    document.getElementById('genTime').textContent='Updated '+fmtTime(DATA.generatedAt);
    document.getElementById('genSmall').textContent=fmtTime(DATA.generatedAt);
    renderPage(currentPage);
  } else {
    showLogin();
  }
})();
