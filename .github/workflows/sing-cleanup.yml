name: Sing to Me 自动清理

# 每周一 09:17（北京时间）自动清理已处理超过 30 天的 Sing to Me 请求 + 其 R2 语音。
# 拒绝( rejected )的条目：音频在拒绝时已被即时删除，这里只清 DB 行，避免无限堆积。
# 鉴权：复用主后台 ADMIN_KEY，经请求头 x-admin-key 传递（S-05：不再用 ?admin= query，避免密钥进 URL/日志）。
on:
  schedule:
    - cron: "17 1 * * 1"   # UTC 01:17 = 北京 09:17，每周一
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sing cleanup
        run: |
          set -e
          URL="https://955827.xyz/api/sing?clean=1"
          echo "GET $URL (admin key via header, not printed)"
          curl -fsS -X GET "$URL" -H "x-admin-key: ${{ secrets.ADMIN_KEY }}" -w "\nHTTP %{http_code}\n" || echo "cleanup call failed (non-fatal)"
